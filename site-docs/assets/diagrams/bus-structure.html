<!DOCTYPE html>

<title>Inside the bus</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600&amp;family=Ubuntu+Mono&amp;display=swap" rel="stylesheet"/>
<style>body { margin: 24px auto; max-width: 688px; padding: 0 16px; } * { box-sizing: border-box; }</style>

<body>
<!-- diagram:start -->
<figure class="circuit-figure" data-diagram="bus-structure">
<div class="diagram-viewport" role="region" aria-label="Inside the bus" tabindex="0">
<svg viewBox="0 0 640 336" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="bus-structure-title bus-structure-desc">
<title id="bus-structure-title">Inside the bus</title>
<desc id="bus-structure-desc">Each master has its own router, which decodes the address and either answers an error itself or passes the request to one target port. A target port reached by two masters gets a two-port arbiter; a port reached by one master is a straight connection.</desc>
<style>.circuit-figure {
  --dg-paper: var(--md-default-bg-color, #fff);
  --dg-ink: var(--md-default-fg-color, #202735);
  --dg-muted: #566174;
  --dg-rule: #c8ced8;
  --dg-surface: #f5f6f9;
  --dg-accent: #4051b5;
  --dg-tint: #eef0fc;
  margin: 1.5rem 0; max-width: 100%; text-align: left;
  font-family: var(--md-text-font-family, 'Noto Sans', sans-serif);
}
[data-md-color-scheme="slate"] .circuit-figure {
  --dg-muted: #b4bdd0; --dg-rule: #4b5569; --dg-surface: #262c38;
  --dg-accent: #acb7ff; --dg-tint: #303853;
}
@media (prefers-color-scheme: dark) {
  .diagram-standalone .circuit-figure {
    --dg-paper: #1e2129; --dg-ink: #e4e7ef; --dg-muted: #b4bdd0;
    --dg-rule: #4b5569; --dg-surface: #262c38;
    --dg-accent: #acb7ff; --dg-tint: #303853;
  }
  .diagram-standalone body { background: #1e2129; color: #e4e7ef; }
}
.circuit-figure .diagram-viewport {
  max-width: 100%; overflow: auto; overscroll-behavior-x: contain;
}
.circuit-figure .diagram-viewport:focus-visible {
  outline: 2px solid var(--dg-accent); outline-offset: 3px;
}
.circuit-figure svg { display: block; width: 640px; min-width: 640px; max-width: none; margin: 0 auto; }
.circuit-figure figcaption {
  display: block; margin: .6rem 0 0; max-width: none; text-align: left;
  color: var(--dg-muted); font-style: normal; font-size: 14px; line-height: 1.6;
}
.circuit-figure figcaption strong { color: var(--dg-ink); font-weight: 600; }
.circuit-figure .dg-zone { fill: var(--dg-paper); stroke: var(--dg-rule); stroke-width: 1.2; }
.circuit-figure .dg-box { fill: var(--dg-paper); stroke: var(--dg-rule); stroke-width: 1.2; }
.circuit-figure .dg-store { fill: var(--dg-surface); stroke: var(--dg-rule); stroke-width: 1.2; }
.circuit-figure .dg-focus { fill: var(--dg-tint); stroke: var(--dg-accent); stroke-width: 1.4; }
.circuit-figure .dg-label { fill: var(--dg-paper); stroke: none; }
.circuit-figure text { fill: var(--dg-ink); font-family: var(--md-text-font-family, 'Noto Sans', sans-serif); font-size: 16px; }
.circuit-figure .dg-name { font-weight: 600; }
.circuit-figure .dg-small { font-size: 14px; fill: var(--dg-muted); }
.circuit-figure .dg-code { font-family: var(--md-code-font-family, 'Ubuntu Mono', monospace); font-size: 14px; fill: var(--dg-muted); }
.circuit-figure .dg-tag { font-size: 12px; font-weight: 600; letter-spacing: .06em; fill: var(--dg-muted); }
.circuit-figure .dg-edge { fill: none; stroke: var(--dg-muted); stroke-width: 1.5; }
.circuit-figure .dg-marker { fill: var(--dg-muted); }
.circuit-figure .dg-marker-accent { fill: var(--dg-accent); }
.circuit-figure .dg-rule { stroke: var(--dg-rule); stroke-width: 1; }
.circuit-figure .dg-wave { fill: none; stroke: var(--dg-ink); stroke-width: 1.5; }
.circuit-figure .dg-wave-focus { fill: none; stroke: var(--dg-accent); stroke-width: 2; }</style>
<defs>
<marker id="bus-structure-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M 0 0 L 8 3 L 0 6 Z" class="dg-marker"/></marker>
<marker id="bus-structure-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M 0 0 L 8 3 L 0 6 Z" class="dg-marker-accent"/></marker>
<marker id="bus-structure-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M 0 0 L 8 3 L 0 6 Z" class="dg-marker"/></marker>
</defs>
<rect width="640" height="336" fill="var(--dg-paper)"/>
<rect data-node="m0" x="40" y="32" width="160" height="48" rx="6" class="dg-box"/>
<text x="120.0" y="61.0" class="dg-name" text-anchor="middle">master A</text>
<rect data-node="m1" x="440" y="32" width="160" height="48" rx="6" class="dg-box"/>
<text x="520.0" y="61.0" class="dg-name" text-anchor="middle">master B</text>
<path class="dg-edge" d="M 120 80 L 120 112" marker-end="url(#bus-structure-arrow)"/>
<path class="dg-edge" d="M 520 80 L 520 112" marker-end="url(#bus-structure-arrow)"/>
<rect data-node="r0" x="40" y="112" width="160" height="56" rx="6" class="dg-focus"/>
<text x="120.0" y="137.0" class="dg-name" text-anchor="middle">A_ROUTER</text>
<text x="120.0" y="159.0" class="dg-small" text-anchor="middle">decode · errors</text>
<rect data-node="r1" x="440" y="112" width="160" height="56" rx="6" class="dg-focus"/>
<text x="520.0" y="137.0" class="dg-name" text-anchor="middle">B_ROUTER</text>
<text x="520.0" y="159.0" class="dg-small" text-anchor="middle">decode · errors</text>
<rect data-node="arb" x="240" y="208" width="160" height="48" rx="6" class="dg-box"/>
<text x="320.0" y="237.0" class="dg-name" text-anchor="middle">X_ARBITER</text>
<path class="dg-edge" d="M 160 168 L 160 232 L 240 232" marker-end="url(#bus-structure-arrow)"/>
<path class="dg-edge" d="M 480 168 L 480 232 L 400 232" marker-end="url(#bus-structure-arrow)"/>
<path class="dg-edge" d="M 320 256 L 320 288" marker-end="url(#bus-structure-arrow)"/>
<rect data-node="x" x="240" y="288" width="160" height="40" rx="6" class="dg-store"/>
<text x="320.0" y="313.0" class="dg-name" text-anchor="middle">target X</text>
<path class="dg-edge" d="M 80 168 L 80 288" marker-end="url(#bus-structure-arrow)"/>
<rect data-node="y" x="24" y="288" width="112" height="40" rx="6" class="dg-store"/>
<text x="80.0" y="313.0" class="dg-name" text-anchor="middle">target Y</text>
<path class="dg-edge" d="M 560 168 L 560 288" marker-end="url(#bus-structure-arrow)"/>
<rect data-node="z" x="504" y="288" width="112" height="40" rx="6" class="dg-store"/>
<text x="560.0" y="313.0" class="dg-name" text-anchor="middle">target Z</text>
<text x="92" y="264" class="dg-tag" text-anchor="start">only A</text>
<text x="572" y="264" class="dg-tag" text-anchor="start">only B</text>
</svg>
</div>
<figcaption><strong>Per master a router, per shared target an arbiter.</strong> A router holds one request at a time, finds the region its address falls in and offers the request on that target's port, with the address made local to the window. An address in no region, or a fetch from a window that is not executable, is answered by the router with a Range status. When two masters reach one port, the two-port arbiter of § 3 takes turns.</figcaption>
</figure>
<!-- diagram:end -->
</body>
</html>
