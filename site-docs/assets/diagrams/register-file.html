<!DOCTYPE html>
<html lang="en" class="diagram-standalone">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>31 stored words, two read ports</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600&amp;family=Ubuntu+Mono&amp;display=swap" rel="stylesheet"/>
<style>body { margin: 24px auto; max-width: 688px; padding: 0 16px; } * { box-sizing: border-box; }</style>
</head>
<body>
<!-- diagram:start -->
<figure class="circuit-figure" data-diagram="register-file">
<div class="diagram-viewport" role="region" aria-label="31 stored words, two read ports" tabindex="0">
<svg viewBox="0 0 640 432" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="register-file-title register-file-desc">
<title id="register-file-title">31 stored words, two read ports</title>
<desc id="register-file-desc">The register file writes one of 31 whole-word registers for x1 to x31 and has two independent read selectors; x0 comes from a constant, not storage cells.</desc>
<style>.circuit-figure {
  --dg-paper: var(--md-default-bg-color, #fff);
  --dg-ink: var(--md-default-fg-color, #202735);
  --dg-muted: #566174;
  --dg-rule: #c8ced8;
  --dg-surface: #f5f6f9;
  --dg-accent: #4051b5;
  --dg-tint: #eef0fc;
  margin: 1.5rem 0; max-width: 100%; text-align: left;
  font-family: var(--md-text-font-family, 'Noto Sans', sans-serif);
}
[data-md-color-scheme="slate"] .circuit-figure {
  --dg-muted: #b4bdd0; --dg-rule: #4b5569; --dg-surface: #262c38;
  --dg-accent: #acb7ff; --dg-tint: #303853;
}
@media (prefers-color-scheme: dark) {
  .diagram-standalone .circuit-figure {
    --dg-paper: #1e2129; --dg-ink: #e4e7ef; --dg-muted: #b4bdd0;
    --dg-rule: #4b5569; --dg-surface: #262c38;
    --dg-accent: #acb7ff; --dg-tint: #303853;
  }
  .diagram-standalone body { background: #1e2129; color: #e4e7ef; }
}
.circuit-figure .diagram-viewport {
  max-width: 100%; overflow: auto; overscroll-behavior-x: contain;
}
.circuit-figure .diagram-viewport:focus-visible {
  outline: 2px solid var(--dg-accent); outline-offset: 3px;
}
.circuit-figure svg { display: block; width: 640px; min-width: 640px; max-width: none; margin: 0 auto; }
.circuit-figure figcaption {
  display: block; margin: .6rem 0 0; max-width: none; text-align: left;
  color: var(--dg-muted); font-style: normal; font-size: 14px; line-height: 1.6;
}
.circuit-figure figcaption strong { color: var(--dg-ink); font-weight: 600; }
.circuit-figure .dg-zone { fill: var(--dg-paper); stroke: var(--dg-rule); stroke-width: 1.2; }
.circuit-figure .dg-box { fill: var(--dg-paper); stroke: var(--dg-rule); stroke-width: 1.2; }
.circuit-figure .dg-store { fill: var(--dg-surface); stroke: var(--dg-rule); stroke-width: 1.2; }
.circuit-figure .dg-focus { fill: var(--dg-tint); stroke: var(--dg-accent); stroke-width: 1.4; }
.circuit-figure .dg-label { fill: var(--dg-paper); stroke: none; }
.circuit-figure text { fill: var(--dg-ink); font-family: var(--md-text-font-family, 'Noto Sans', sans-serif); font-size: 16px; }
.circuit-figure .dg-name { font-weight: 600; }
.circuit-figure .dg-small { font-size: 14px; fill: var(--dg-muted); }
.circuit-figure .dg-code { font-family: var(--md-code-font-family, 'Ubuntu Mono', monospace); font-size: 14px; fill: var(--dg-muted); }
.circuit-figure .dg-tag { font-size: 12px; font-weight: 600; letter-spacing: .06em; fill: var(--dg-muted); }
.circuit-figure .dg-edge { fill: none; stroke: var(--dg-muted); stroke-width: 1.5; }
.circuit-figure .dg-marker { fill: var(--dg-muted); }
.circuit-figure .dg-marker-accent { fill: var(--dg-accent); }
.circuit-figure .dg-rule { stroke: var(--dg-rule); stroke-width: 1; }</style>
<defs>
<marker id="register-file-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M 0 0 L 8 3 L 0 6 Z" class="dg-marker"/></marker>
<marker id="register-file-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M 0 0 L 8 3 L 0 6 Z" class="dg-marker-accent"/></marker>
<marker id="register-file-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M 0 0 L 8 3 L 0 6 Z" class="dg-marker"/></marker>
</defs>
<rect width="640" height="432" fill="var(--dg-paper)"/>
<text x="40" y="40" class="dg-name" text-anchor="start">RegisterFile32x32</text>
<path class="dg-edge" d="M 168 160 L 192 160" marker-end="url(#register-file-arrow)"/>
<path class="dg-edge" d="M 408 144 L 456 144" marker-end="url(#register-file-arrow)"/>
<path class="dg-edge" d="M 408 272 L 456 272" marker-end="url(#register-file-arrow)"/>
<rect data-node="write-decoder" x="40" y="124" width="128" height="72" rx="6" class="dg-box"/>
<text x="104.0" y="157.0" class="dg-name" text-anchor="middle">RD_DECODER</text>
<text x="104.0" y="179.0" class="dg-small" text-anchor="middle">one word</text>
<text x="40" y="100" class="dg-tag" text-anchor="start">ONE WRITE PORT</text>
<rect x="192" y="80" width="216" height="256" rx="6" class="dg-focus"/>
<text x="216" y="112" class="dg-name" text-anchor="start">STORAGE</text>
<text x="216" y="136" class="dg-code" text-anchor="start">31 × Register&lt;32&gt;</text>
<rect x="208" y="156" width="184" height="36" rx="4" class="dg-box"/>
<text x="224" y="180" class="dg-code" text-anchor="start">WORD_0</text>
<text x="376" y="180" class="dg-code" text-anchor="end">x1</text>
<rect x="208" y="204" width="184" height="36" rx="4" class="dg-box"/>
<text x="224" y="228" class="dg-code" text-anchor="start">WORD_1</text>
<text x="376" y="228" class="dg-code" text-anchor="end">x2</text>
<rect x="208" y="280" width="184" height="36" rx="4" class="dg-box"/>
<text x="224" y="304" class="dg-code" text-anchor="start">WORD_30</text>
<text x="376" y="304" class="dg-code" text-anchor="end">x31</text>
<text x="300" y="264" class="dg-name" text-anchor="middle">…</text>
<text x="456" y="100" class="dg-tag" text-anchor="start">TWO READ PORTS</text>
<rect data-node="rs1" x="456" y="112" width="144" height="64" rx="6" class="dg-box"/>
<text x="528.0" y="141.0" class="dg-name" text-anchor="middle">RS1_MUX</text>
<text x="528.0" y="163.0" class="dg-small" text-anchor="middle">RS1_VALUE</text>
<rect data-node="rs2" x="456" y="240" width="144" height="64" rx="6" class="dg-box"/>
<text x="528.0" y="269.0" class="dg-name" text-anchor="middle">RS2_MUX</text>
<text x="528.0" y="291.0" class="dg-small" text-anchor="middle">RS2_VALUE</text>
<rect x="192" y="360" width="216" height="48" rx="6" class="dg-store"/>
<text x="300" y="390" class="dg-code" text-anchor="middle">X0_ZERO = 0 · no cells</text>
</svg>
</div>
<figcaption><strong>x0 is not stored.</strong> The two read selectors choose independently from x0 or the 31 stored words. The x0-to-selector wiring is omitted here; the connection table below specifies it.</figcaption>
</figure>
<!-- diagram:end -->
</body>
</html>
