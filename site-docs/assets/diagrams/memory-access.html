<!DOCTYPE html>
<html lang="en" class="diagram-standalone">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Memory requests out, load values back</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600&amp;family=Ubuntu+Mono&amp;display=swap" rel="stylesheet"/>
<style>body { margin: 24px auto; max-width: 688px; padding: 0 16px; } * { box-sizing: border-box; }</style>
</head>
<body>
<!-- diagram:start -->
<figure class="circuit-figure" data-diagram="memory-access">
<div class="diagram-viewport" role="region" aria-label="Memory requests out, load values back" tabindex="0">
<svg viewBox="0 0 640 364" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="memory-access-title memory-access-desc">
<title id="memory-access-title">Memory requests out, load values back</title>
<desc id="memory-access-desc">A request travels from the CPU through lane formatting and request tracking to an endpoint; returning load data is tracked, extracted, and extended before reaching the CPU.</desc>
<style>.circuit-figure {
  --dg-paper: var(--md-default-bg-color, #fff);
  --dg-ink: var(--md-default-fg-color, #202735);
  --dg-muted: #566174;
  --dg-rule: #c8ced8;
  --dg-surface: #f5f6f9;
  --dg-accent: #4051b5;
  --dg-tint: #eef0fc;
  margin: 1.5rem 0; max-width: 100%; text-align: left;
  font-family: var(--md-text-font-family, 'Noto Sans', sans-serif);
}
[data-md-color-scheme="slate"] .circuit-figure {
  --dg-muted: #b4bdd0; --dg-rule: #4b5569; --dg-surface: #262c38;
  --dg-accent: #acb7ff; --dg-tint: #303853;
}
@media (prefers-color-scheme: dark) {
  .diagram-standalone .circuit-figure {
    --dg-paper: #1e2129; --dg-ink: #e4e7ef; --dg-muted: #b4bdd0;
    --dg-rule: #4b5569; --dg-surface: #262c38;
    --dg-accent: #acb7ff; --dg-tint: #303853;
  }
  .diagram-standalone body { background: #1e2129; color: #e4e7ef; }
}
.circuit-figure .diagram-viewport {
  max-width: 100%; overflow: auto; overscroll-behavior-x: contain;
}
.circuit-figure .diagram-viewport:focus-visible {
  outline: 2px solid var(--dg-accent); outline-offset: 3px;
}
.circuit-figure svg { display: block; width: 640px; min-width: 640px; max-width: none; margin: 0 auto; }
.circuit-figure figcaption {
  display: block; margin: .6rem 0 0; max-width: none; text-align: left;
  color: var(--dg-muted); font-style: normal; font-size: 14px; line-height: 1.6;
}
.circuit-figure figcaption strong { color: var(--dg-ink); font-weight: 600; }
.circuit-figure .dg-zone { fill: var(--dg-paper); stroke: var(--dg-rule); stroke-width: 1.2; }
.circuit-figure .dg-box { fill: var(--dg-paper); stroke: var(--dg-rule); stroke-width: 1.2; }
.circuit-figure .dg-store { fill: var(--dg-surface); stroke: var(--dg-rule); stroke-width: 1.2; }
.circuit-figure .dg-focus { fill: var(--dg-tint); stroke: var(--dg-accent); stroke-width: 1.4; }
.circuit-figure .dg-label { fill: var(--dg-paper); stroke: none; }
.circuit-figure text { fill: var(--dg-ink); font-family: var(--md-text-font-family, 'Noto Sans', sans-serif); font-size: 16px; }
.circuit-figure .dg-name { font-weight: 600; }
.circuit-figure .dg-small { font-size: 14px; fill: var(--dg-muted); }
.circuit-figure .dg-code { font-family: var(--md-code-font-family, 'Ubuntu Mono', monospace); font-size: 14px; fill: var(--dg-muted); }
.circuit-figure .dg-tag { font-size: 12px; font-weight: 600; letter-spacing: .06em; fill: var(--dg-muted); }
.circuit-figure .dg-edge { fill: none; stroke: var(--dg-muted); stroke-width: 1.5; }
.circuit-figure .dg-marker { fill: var(--dg-muted); }
.circuit-figure .dg-marker-accent { fill: var(--dg-accent); }
.circuit-figure .dg-rule { stroke: var(--dg-rule); stroke-width: 1; }</style>
<defs>
<marker id="memory-access-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M 0 0 L 8 3 L 0 6 Z" class="dg-marker"/></marker>
<marker id="memory-access-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M 0 0 L 8 3 L 0 6 Z" class="dg-marker-accent"/></marker>
<marker id="memory-access-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M 0 0 L 8 3 L 0 6 Z" class="dg-marker"/></marker>
</defs>
<rect width="640" height="364" fill="var(--dg-paper)"/>
<text x="40" y="40" class="dg-tag" text-anchor="start">OUTGOING REQUEST</text>
<text x="40" y="212" class="dg-tag" text-anchor="start">RETURNING LOAD DATA</text>
<path class="dg-edge" d="M 168 96 L 184 96" marker-end="url(#memory-access-arrow)"/>
<path class="dg-edge" d="M 312 96 L 328 96" marker-end="url(#memory-access-arrow)"/>
<path class="dg-edge" d="M 456 96 L 472 96" marker-end="url(#memory-access-arrow)"/>
<path class="dg-edge" d="M 184 268 L 168 268" marker-end="url(#memory-access-arrow)"/>
<path class="dg-edge" d="M 328 268 L 312 268" marker-end="url(#memory-access-arrow)"/>
<path class="dg-edge" d="M 472 268 L 456 268" marker-end="url(#memory-access-arrow)"/>
<rect data-node="request-CPU" x="40" y="64" width="128" height="64" rx="6" class="dg-box"/>
<text x="104.0" y="101.0" class="dg-name" text-anchor="middle">CPU</text>
<rect data-node="response-CPU" x="40" y="236" width="128" height="64" rx="6" class="dg-box"/>
<text x="104.0" y="273.0" class="dg-name" text-anchor="middle">CPU</text>
<text x="104" y="156" class="dg-small" text-anchor="middle">address + data</text>
<text x="104" y="328" class="dg-small" text-anchor="middle">load value</text>
<rect data-node="request-Lanes" x="184" y="64" width="128" height="64" rx="6" class="dg-box"/>
<text x="248.0" y="101.0" class="dg-name" text-anchor="middle">Lanes</text>
<rect data-node="response-Lanes" x="184" y="236" width="128" height="64" rx="6" class="dg-box"/>
<text x="248.0" y="273.0" class="dg-name" text-anchor="middle">Lanes</text>
<text x="248" y="156" class="dg-small" text-anchor="middle">place / mask</text>
<text x="248" y="328" class="dg-small" text-anchor="middle">extract / extend</text>
<rect data-node="request-Request" x="328" y="64" width="128" height="64" rx="6" class="dg-focus"/>
<text x="392.0" y="101.0" class="dg-name" text-anchor="middle">Request</text>
<rect data-node="response-Request" x="328" y="236" width="128" height="64" rx="6" class="dg-box"/>
<text x="392.0" y="273.0" class="dg-name" text-anchor="middle">Request</text>
<text x="392" y="156" class="dg-small" text-anchor="middle">hold until done</text>
<text x="392" y="328" class="dg-small" text-anchor="middle">response word</text>
<rect data-node="request-Endpoint" x="472" y="64" width="128" height="64" rx="6" class="dg-box"/>
<text x="536.0" y="101.0" class="dg-name" text-anchor="middle">Endpoint</text>
<rect data-node="response-Endpoint" x="472" y="236" width="128" height="64" rx="6" class="dg-box"/>
<text x="536.0" y="273.0" class="dg-name" text-anchor="middle">Endpoint</text>
<text x="536" y="156" class="dg-small" text-anchor="middle">access storage</text>
<text x="536" y="328" class="dg-small" text-anchor="middle">return word</text>
</svg>
</div>
<figcaption><strong>Pipeline transaction path.</strong> Lanes = RV32IMemoryLanes; Request = RV32IMemoryRequest. Endpoint = controller plus native storage, or its fused MemoryEndpoint. The single-cycle and baseline cores re-use Lanes with combinational formatting to zero-wait endpoints. Arrows show payload flow, not clock cycles or the complete handshake wiring.</figcaption>
</figure>
<!-- diagram:end -->
</body>
</html>
