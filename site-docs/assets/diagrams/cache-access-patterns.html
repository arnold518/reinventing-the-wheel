<!DOCTYPE html>
<html lang="en" class="diagram-standalone">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Cycles per read by access pattern and path</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600&amp;family=Ubuntu+Mono&amp;display=swap" rel="stylesheet"/>
<style>body { margin: 24px auto; max-width: 688px; padding: 0 16px; } * { box-sizing: border-box; }</style>
</head>
<body>
<!-- diagram:start -->
<figure class="circuit-figure" data-diagram="cache-access-patterns">
<div class="diagram-viewport" role="region" aria-label="Cycles per read by access pattern and path" tabindex="0">
<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cache-access-patterns-title cache-access-patterns-desc">
<title id="cache-access-patterns-title">Cycles per read by access pattern and path</title>
<desc id="cache-access-patterns-desc">Bars give the cycles per read of three access patterns, read straight from DRAM, through one level-1 cache, and through a level-1 and a level-2 cache, in the embedded profile.</desc>
<style>.circuit-figure {
  --dg-paper: var(--md-default-bg-color, #fff);
  --dg-ink: var(--md-default-fg-color, #202735);
  --dg-muted: #566174;
  --dg-rule: #c8ced8;
  --dg-surface: #f5f6f9;
  --dg-accent: #4051b5;
  --dg-tint: #eef0fc;
  margin: 1.5rem 0; max-width: 100%; text-align: left;
  font-family: var(--md-text-font-family, 'Noto Sans', sans-serif);
}
[data-md-color-scheme="slate"] .circuit-figure {
  --dg-muted: #b4bdd0; --dg-rule: #4b5569; --dg-surface: #262c38;
  --dg-accent: #acb7ff; --dg-tint: #303853;
}
@media (prefers-color-scheme: dark) {
  .diagram-standalone .circuit-figure {
    --dg-paper: #1e2129; --dg-ink: #e4e7ef; --dg-muted: #b4bdd0;
    --dg-rule: #4b5569; --dg-surface: #262c38;
    --dg-accent: #acb7ff; --dg-tint: #303853;
  }
  .diagram-standalone body { background: #1e2129; color: #e4e7ef; }
}
.circuit-figure .diagram-viewport {
  max-width: 100%; overflow: auto; overscroll-behavior-x: contain;
}
.circuit-figure .diagram-viewport:focus-visible {
  outline: 2px solid var(--dg-accent); outline-offset: 3px;
}
.circuit-figure svg { display: block; width: 640px; min-width: 640px; max-width: none; margin: 0 auto; }
.circuit-figure figcaption {
  display: block; margin: .6rem 0 0; max-width: none; text-align: left;
  color: var(--dg-muted); font-style: normal; font-size: 14px; line-height: 1.6;
}
.circuit-figure figcaption strong { color: var(--dg-ink); font-weight: 600; }
.circuit-figure .dg-zone { fill: var(--dg-paper); stroke: var(--dg-rule); stroke-width: 1.2; }
.circuit-figure .dg-box { fill: var(--dg-paper); stroke: var(--dg-rule); stroke-width: 1.2; }
.circuit-figure .dg-store { fill: var(--dg-surface); stroke: var(--dg-rule); stroke-width: 1.2; }
.circuit-figure .dg-focus { fill: var(--dg-tint); stroke: var(--dg-accent); stroke-width: 1.4; }
.circuit-figure .dg-label { fill: var(--dg-paper); stroke: none; }
.circuit-figure text { fill: var(--dg-ink); font-family: var(--md-text-font-family, 'Noto Sans', sans-serif); font-size: 16px; }
.circuit-figure .dg-name { font-weight: 600; }
.circuit-figure .dg-small { font-size: 14px; fill: var(--dg-muted); }
.circuit-figure .dg-code { font-family: var(--md-code-font-family, 'Ubuntu Mono', monospace); font-size: 14px; fill: var(--dg-muted); }
.circuit-figure .dg-tag { font-size: 12px; font-weight: 600; letter-spacing: .06em; fill: var(--dg-muted); }
.circuit-figure .dg-edge { fill: none; stroke: var(--dg-muted); stroke-width: 1.5; }
.circuit-figure .dg-marker { fill: var(--dg-muted); }
.circuit-figure .dg-marker-accent { fill: var(--dg-accent); }
.circuit-figure .dg-rule { stroke: var(--dg-rule); stroke-width: 1; }
.circuit-figure .dg-wave { fill: none; stroke: var(--dg-ink); stroke-width: 1.5; }
.circuit-figure .dg-wave-focus { fill: none; stroke: var(--dg-accent); stroke-width: 2; }</style>
<defs>
<marker id="cache-access-patterns-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M 0 0 L 8 3 L 0 6 Z" class="dg-marker"/></marker>
<marker id="cache-access-patterns-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M 0 0 L 8 3 L 0 6 Z" class="dg-marker-accent"/></marker>
<marker id="cache-access-patterns-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M 0 0 L 8 3 L 0 6 Z" class="dg-marker"/></marker>
</defs>
<rect width="640" height="300" fill="var(--dg-paper)"/>
<text x="40" y="28" class="dg-tag" text-anchor="start">CYCLES PER READ</text>
<text x="40" y="58" class="dg-name" text-anchor="start">Sequential</text>
<text x="176" y="80" class="dg-small" text-anchor="end">S0 DRAM</text>
<rect x="192" y="68" width="96" height="14" rx="2" class="dg-store"/>
<text x="296" y="80" class="dg-small" text-anchor="start">8.05</text>
<text x="176" y="98" class="dg-small" text-anchor="end">S1 L1</text>
<rect x="192" y="86" width="60" height="14" rx="2" class="dg-focus"/>
<text x="260" y="98" class="dg-small" text-anchor="start">5.08</text>
<text x="176" y="116" class="dg-small" text-anchor="end">S2 L1 + L2</text>
<rect x="192" y="104" width="68" height="14" rx="2" class="dg-box"/>
<text x="268" y="116" class="dg-small" text-anchor="start">5.83</text>
<text x="40" y="142" class="dg-name" text-anchor="start">One word per cache line</text>
<text x="176" y="164" class="dg-small" text-anchor="end">S0 DRAM</text>
<rect x="192" y="152" width="96" height="14" rx="2" class="dg-store"/>
<text x="296" y="164" class="dg-small" text-anchor="start">8.12</text>
<text x="176" y="182" class="dg-small" text-anchor="end">S1 L1</text>
<rect x="192" y="170" width="172" height="14" rx="2" class="dg-focus"/>
<text x="372" y="182" class="dg-small" text-anchor="start">14.29</text>
<text x="176" y="200" class="dg-small" text-anchor="end">S2 L1 + L2</text>
<rect x="192" y="188" width="208" height="14" rx="2" class="dg-box"/>
<text x="408" y="200" class="dg-small" text-anchor="start">17.32</text>
<text x="40" y="226" class="dg-name" text-anchor="start">One word per DRAM row</text>
<text x="176" y="248" class="dg-small" text-anchor="end">S0 DRAM</text>
<rect x="192" y="236" width="240" height="14" rx="2" class="dg-store"/>
<text x="440" y="248" class="dg-small" text-anchor="start">19.93</text>
<text x="176" y="266" class="dg-small" text-anchor="end">S1 L1</text>
<rect x="192" y="254" width="316" height="14" rx="2" class="dg-focus"/>
<text x="516" y="266" class="dg-small" text-anchor="start">26.20</text>
<text x="176" y="284" class="dg-small" text-anchor="end">S2 L1 + L2</text>
<rect x="192" y="272" width="352" height="14" rx="2" class="dg-box"/>
<text x="552" y="284" class="dg-small" text-anchor="start">29.19</text>
</svg>
</div>
<figcaption><strong>Cycles per read, <code>embedded</code>, 2,048 reads.</strong> A cache helps sequential reads and slows down reads that use one word of each line; the second level adds a lookup to every miss. Values from the table above.</figcaption>
</figure>
<!-- diagram:end -->
</body>
</html>
