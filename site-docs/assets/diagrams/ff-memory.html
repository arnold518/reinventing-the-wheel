<!DOCTYPE html>
<html lang="en" class="diagram-standalone">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>FF memory: bank, word, cell</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600&amp;family=Ubuntu+Mono&amp;display=swap" rel="stylesheet"/>
<style>body { margin: 24px auto; max-width: 688px; padding: 0 16px; } * { box-sizing: border-box; }</style>
</head>
<body>
<!-- diagram:start -->
<figure class="circuit-figure" data-diagram="ff-memory">
<div class="diagram-viewport" role="region" aria-label="FF memory: bank, word, cell" tabindex="0">
<svg viewBox="0 0 640 432" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ff-memory-title ff-memory-desc">
<title id="ff-memory-title">FF memory: bank, word, cell</title>
<desc id="ff-memory-desc">FFMemory contains address and access helpers plus an FFStorageBank of N FFWord instances, each containing W FlipFlopCell instances.</desc>
<style>.circuit-figure {
  --dg-paper: var(--md-default-bg-color, #fff);
  --dg-ink: var(--md-default-fg-color, #202735);
  --dg-muted: #566174;
  --dg-rule: #c8ced8;
  --dg-surface: #f5f6f9;
  --dg-accent: #4051b5;
  --dg-tint: #eef0fc;
  margin: 1.5rem 0; max-width: 100%; text-align: left;
  font-family: var(--md-text-font-family, 'Noto Sans', sans-serif);
}
[data-md-color-scheme="slate"] .circuit-figure {
  --dg-muted: #b4bdd0; --dg-rule: #4b5569; --dg-surface: #262c38;
  --dg-accent: #acb7ff; --dg-tint: #303853;
}
@media (prefers-color-scheme: dark) {
  .diagram-standalone .circuit-figure {
    --dg-paper: #1e2129; --dg-ink: #e4e7ef; --dg-muted: #b4bdd0;
    --dg-rule: #4b5569; --dg-surface: #262c38;
    --dg-accent: #acb7ff; --dg-tint: #303853;
  }
  .diagram-standalone body { background: #1e2129; color: #e4e7ef; }
}
.circuit-figure .diagram-viewport {
  max-width: 100%; overflow: auto; overscroll-behavior-x: contain;
}
.circuit-figure .diagram-viewport:focus-visible {
  outline: 2px solid var(--dg-accent); outline-offset: 3px;
}
.circuit-figure svg { display: block; width: 640px; min-width: 640px; max-width: none; margin: 0 auto; }
.circuit-figure figcaption {
  display: block; margin: .6rem 0 0; max-width: none; text-align: left;
  color: var(--dg-muted); font-style: normal; font-size: 14px; line-height: 1.6;
}
.circuit-figure figcaption strong { color: var(--dg-ink); font-weight: 600; }
.circuit-figure .dg-zone { fill: var(--dg-paper); stroke: var(--dg-rule); stroke-width: 1.2; }
.circuit-figure .dg-box { fill: var(--dg-paper); stroke: var(--dg-rule); stroke-width: 1.2; }
.circuit-figure .dg-store { fill: var(--dg-surface); stroke: var(--dg-rule); stroke-width: 1.2; }
.circuit-figure .dg-focus { fill: var(--dg-tint); stroke: var(--dg-accent); stroke-width: 1.4; }
.circuit-figure .dg-label { fill: var(--dg-paper); stroke: none; }
.circuit-figure text { fill: var(--dg-ink); font-family: var(--md-text-font-family, 'Noto Sans', sans-serif); font-size: 16px; }
.circuit-figure .dg-name { font-weight: 600; }
.circuit-figure .dg-small { font-size: 14px; fill: var(--dg-muted); }
.circuit-figure .dg-code { font-family: var(--md-code-font-family, 'Ubuntu Mono', monospace); font-size: 14px; fill: var(--dg-muted); }
.circuit-figure .dg-tag { font-size: 12px; font-weight: 600; letter-spacing: .06em; fill: var(--dg-muted); }
.circuit-figure .dg-edge { fill: none; stroke: var(--dg-muted); stroke-width: 1.5; }
.circuit-figure .dg-marker { fill: var(--dg-muted); }
.circuit-figure .dg-marker-accent { fill: var(--dg-accent); }
.circuit-figure .dg-rule { stroke: var(--dg-rule); stroke-width: 1; }</style>
<defs>
<marker id="ff-memory-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M 0 0 L 8 3 L 0 6 Z" class="dg-marker"/></marker>
<marker id="ff-memory-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M 0 0 L 8 3 L 0 6 Z" class="dg-marker-accent"/></marker>
<marker id="ff-memory-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M 0 0 L 8 3 L 0 6 Z" class="dg-marker"/></marker>
</defs>
<rect width="640" height="432" fill="var(--dg-paper)"/>
<rect x="40" y="24" width="560" height="384" rx="6" class="dg-zone"/>
<text x="64" y="56" class="dg-name" text-anchor="start">FFMemory&lt;W&gt;</text>
<text x="64" y="88" class="dg-code" text-anchor="start">ADDRESS_DECODE  ·  ACCESS_CONTROL  ·  READ_SELECT</text>
<rect x="64" y="112" width="512" height="272" rx="6" class="dg-store"/>
<text x="88" y="148" class="dg-name" text-anchor="start">STORAGE · FFStorageBank&lt;W&gt;</text>
<text x="552" y="148" class="dg-small" text-anchor="end">N words</text>
<rect x="88" y="176" width="464" height="184" rx="6" class="dg-zone"/>
<text x="112" y="212" class="dg-name" text-anchor="start">WORD_n · FFWord&lt;W&gt;</text>
<text x="528" y="212" class="dg-small" text-anchor="end">W bits</text>
<rect x="112" y="240" width="72" height="52" rx="6" class="dg-focus"/>
<text x="148" y="272" class="dg-code" text-anchor="middle">b0</text>
<rect x="208" y="240" width="72" height="52" rx="6" class="dg-box"/>
<text x="244" y="272" class="dg-code" text-anchor="middle">b1</text>
<rect x="400" y="240" width="120" height="52" rx="6" class="dg-box"/>
<text x="460" y="272" class="dg-code" text-anchor="middle">b(W−1)</text>
<text x="344" y="272" class="dg-name" text-anchor="middle">…</text>
<text x="112" y="332" class="dg-small" text-anchor="start">FlipFlopCell × W  ·  labels are bit positions, not values</text>
</svg>
</div>
<figcaption><strong>N words × W bits.</strong> One representative word is expanded. Address decoding and read selection act around the bank; they are not additional storage layers.</figcaption>
</figure>
<!-- diagram:end -->
</body>
</html>
