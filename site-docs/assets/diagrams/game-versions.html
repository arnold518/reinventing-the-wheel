<!DOCTYPE html>
<html lang="en" class="diagram-standalone">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>One game program, two versions</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600&amp;family=Ubuntu+Mono&amp;display=swap" rel="stylesheet"/>
<style>body { margin: 24px auto; max-width: 688px; padding: 0 16px; } * { box-sizing: border-box; }</style>
</head>
<body>
<!-- diagram:start -->
<figure class="circuit-figure" data-diagram="game-versions">
<div class="diagram-viewport" role="region" aria-label="One game program, two versions" tabindex="0">
<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="game-versions-title game-versions-desc">
<title id="game-versions-title">One game program, two versions</title>
<desc id="game-versions-desc">A short version starts from a prepared board, takes one or two button presses queued at fixed cycles, runs on a 32 by 24 screen and opens as a live scenario. A long version is a computer player&#x27;s whole session: one batch of button changes after each frame, on the 64 by 48 screen, published as a recording with one checkpoint per frame.</desc>
<style>.circuit-figure {
  --dg-paper: var(--md-default-bg-color, #fff);
  --dg-ink: var(--md-default-fg-color, #202735);
  --dg-muted: #566174;
  --dg-rule: #c8ced8;
  --dg-surface: #f5f6f9;
  --dg-accent: #4051b5;
  --dg-tint: #eef0fc;
  margin: 1.5rem 0; max-width: 100%; text-align: left;
  font-family: var(--md-text-font-family, 'Noto Sans', sans-serif);
}
[data-md-color-scheme="slate"] .circuit-figure {
  --dg-muted: #b4bdd0; --dg-rule: #4b5569; --dg-surface: #262c38;
  --dg-accent: #acb7ff; --dg-tint: #303853;
}
@media (prefers-color-scheme: dark) {
  .diagram-standalone .circuit-figure {
    --dg-paper: #1e2129; --dg-ink: #e4e7ef; --dg-muted: #b4bdd0;
    --dg-rule: #4b5569; --dg-surface: #262c38;
    --dg-accent: #acb7ff; --dg-tint: #303853;
  }
  .diagram-standalone body { background: #1e2129; color: #e4e7ef; }
}
.circuit-figure .diagram-viewport {
  max-width: 100%; overflow: auto; overscroll-behavior-x: contain;
}
.circuit-figure .diagram-viewport:focus-visible {
  outline: 2px solid var(--dg-accent); outline-offset: 3px;
}
.circuit-figure svg { display: block; width: 640px; min-width: 640px; max-width: none; margin: 0 auto; }
.circuit-figure figcaption {
  display: block; margin: .6rem 0 0; max-width: none; text-align: left;
  color: var(--dg-muted); font-style: normal; font-size: 14px; line-height: 1.6;
}
.circuit-figure figcaption strong { color: var(--dg-ink); font-weight: 600; }
.circuit-figure .dg-zone { fill: var(--dg-paper); stroke: var(--dg-rule); stroke-width: 1.2; }
.circuit-figure .dg-box { fill: var(--dg-paper); stroke: var(--dg-rule); stroke-width: 1.2; }
.circuit-figure .dg-store { fill: var(--dg-surface); stroke: var(--dg-rule); stroke-width: 1.2; }
.circuit-figure .dg-focus { fill: var(--dg-tint); stroke: var(--dg-accent); stroke-width: 1.4; }
.circuit-figure .dg-label { fill: var(--dg-paper); stroke: none; }
.circuit-figure text { fill: var(--dg-ink); font-family: var(--md-text-font-family, 'Noto Sans', sans-serif); font-size: 16px; }
.circuit-figure .dg-name { font-weight: 600; }
.circuit-figure .dg-small { font-size: 14px; fill: var(--dg-muted); }
.circuit-figure .dg-code { font-family: var(--md-code-font-family, 'Ubuntu Mono', monospace); font-size: 14px; fill: var(--dg-muted); }
.circuit-figure .dg-tag { font-size: 12px; font-weight: 600; letter-spacing: .06em; fill: var(--dg-muted); }
.circuit-figure .dg-edge { fill: none; stroke: var(--dg-muted); stroke-width: 1.5; }
.circuit-figure .dg-marker { fill: var(--dg-muted); }
.circuit-figure .dg-marker-accent { fill: var(--dg-accent); }
.circuit-figure .dg-rule { stroke: var(--dg-rule); stroke-width: 1; }
.circuit-figure .dg-wave { fill: none; stroke: var(--dg-ink); stroke-width: 1.5; }
.circuit-figure .dg-wave-focus { fill: none; stroke: var(--dg-accent); stroke-width: 2; }</style>
<defs>
<marker id="game-versions-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M 0 0 L 8 3 L 0 6 Z" class="dg-marker"/></marker>
<marker id="game-versions-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M 0 0 L 8 3 L 0 6 Z" class="dg-marker-accent"/></marker>
<marker id="game-versions-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M 0 0 L 8 3 L 0 6 Z" class="dg-marker"/></marker>
</defs>
<rect width="640" height="300" fill="var(--dg-paper)"/>
<text x="40" y="28" class="dg-tag" text-anchor="start">SHORT · SCENARIO</text>
<rect data-node="s-board" x="40" y="40" width="128" height="64" rx="6" class="dg-box"/>
<text x="104.0" y="69.0" class="dg-name" text-anchor="middle">Board</text>
<text x="104.0" y="91.0" class="dg-small" text-anchor="middle">prepared</text>
<path class="dg-edge" d="M 168 72 L 184 72" marker-end="url(#game-versions-arrow)"/>
<rect data-node="s-input" x="184" y="40" width="128" height="64" rx="6" class="dg-box"/>
<text x="248.0" y="69.0" class="dg-name" text-anchor="middle">Presses</text>
<text x="248.0" y="91.0" class="dg-small" text-anchor="middle">1–2, queued</text>
<path class="dg-edge" d="M 312 72 L 328 72" marker-end="url(#game-versions-arrow)"/>
<rect data-node="s-machine" x="328" y="40" width="128" height="64" rx="6" class="dg-focus"/>
<text x="392.0" y="69.0" class="dg-name" text-anchor="middle">Machine</text>
<text x="392.0" y="91.0" class="dg-small" text-anchor="middle">32 × 24 screen</text>
<path class="dg-edge" d="M 456 72 L 472 72" marker-end="url(#game-versions-arrow)"/>
<rect data-node="s-view" x="472" y="40" width="128" height="64" rx="6" class="dg-box"/>
<text x="536.0" y="69.0" class="dg-name" text-anchor="middle">Scenario</text>
<text x="536.0" y="91.0" class="dg-small" text-anchor="middle">every wire</text>
<text x="40" y="160" class="dg-tag" text-anchor="start">LONG · RECORDING</text>
<rect data-node="l-player" x="40" y="172" width="128" height="64" rx="6" class="dg-box"/>
<text x="104.0" y="201.0" class="dg-name" text-anchor="middle">Player</text>
<text x="104.0" y="223.0" class="dg-small" text-anchor="middle">the C rules</text>
<path class="dg-edge" d="M 168 204 L 184 204" marker-end="url(#game-versions-arrow)"/>
<rect data-node="l-input" x="184" y="172" width="128" height="64" rx="6" class="dg-box"/>
<text x="248.0" y="201.0" class="dg-name" text-anchor="middle">Batches</text>
<text x="248.0" y="223.0" class="dg-small" text-anchor="middle">one per frame</text>
<path class="dg-edge" d="M 312 204 L 328 204" marker-end="url(#game-versions-arrow)"/>
<rect data-node="l-machine" x="328" y="172" width="128" height="64" rx="6" class="dg-focus"/>
<text x="392.0" y="201.0" class="dg-name" text-anchor="middle">Machine</text>
<text x="392.0" y="223.0" class="dg-small" text-anchor="middle">64 × 48 screen</text>
<path class="dg-edge" d="M 456 204 L 472 204" marker-end="url(#game-versions-arrow)"/>
<rect data-node="l-view" x="472" y="172" width="128" height="64" rx="6" class="dg-store"/>
<text x="536.0" y="201.0" class="dg-name" text-anchor="middle">Recording</text>
<text x="536.0" y="223.0" class="dg-small" text-anchor="middle">every frame</text>
<text x="40" y="276" class="dg-small" text-anchor="start">Both: Compact parts on their proven delays, embedded timing, a 4.5 ns clock.</text>
</svg>
</div>
<figcaption><strong>Same machine, same program source, two sizes of run.</strong> Both run on <code>games-machine</code> in Compact with embedded timing and a 4.5 ns clock, and both are checked instruction by instruction. The short version keeps every wire's history in the visualizer; the long version keeps the machine's state at each frame.</figcaption>
</figure>
<!-- diagram:end -->
</body>
</html>
