<!DOCTYPE html>
<html lang="en" class="diagram-standalone">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>How an asynchronous SRAM access spends its time</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600&amp;family=Ubuntu+Mono&amp;display=swap" rel="stylesheet"/>
<style>body { margin: 24px auto; max-width: 688px; padding: 0 16px; } * { box-sizing: border-box; }</style>
</head>
<body>
<!-- diagram:start -->
<figure class="circuit-figure" data-diagram="sram-access-chain">
<div class="diagram-viewport" role="region" aria-label="How an asynchronous SRAM access spends its time" tabindex="0">
<svg viewBox="0 0 640 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sram-access-chain-title sram-access-chain-desc">
<title id="sram-access-chain-title">How an asynchronous SRAM access spends its time</title>
<desc id="sram-access-chain-desc">The stages of an asynchronous SRAM access in order: settle, precharge, decode, bitline development, and sense and output, after which READY rises.</desc>
<style>.circuit-figure {
  --dg-paper: var(--md-default-bg-color, #fff);
  --dg-ink: var(--md-default-fg-color, #202735);
  --dg-muted: #566174;
  --dg-rule: #c8ced8;
  --dg-surface: #f5f6f9;
  --dg-accent: #4051b5;
  --dg-tint: #eef0fc;
  margin: 1.5rem 0; max-width: 100%; text-align: left;
  font-family: var(--md-text-font-family, 'Noto Sans', sans-serif);
}
[data-md-color-scheme="slate"] .circuit-figure {
  --dg-muted: #b4bdd0; --dg-rule: #4b5569; --dg-surface: #262c38;
  --dg-accent: #acb7ff; --dg-tint: #303853;
}
@media (prefers-color-scheme: dark) {
  .diagram-standalone .circuit-figure {
    --dg-paper: #1e2129; --dg-ink: #e4e7ef; --dg-muted: #b4bdd0;
    --dg-rule: #4b5569; --dg-surface: #262c38;
    --dg-accent: #acb7ff; --dg-tint: #303853;
  }
  .diagram-standalone body { background: #1e2129; color: #e4e7ef; }
}
.circuit-figure .diagram-viewport {
  max-width: 100%; overflow: auto; overscroll-behavior-x: contain;
}
.circuit-figure .diagram-viewport:focus-visible {
  outline: 2px solid var(--dg-accent); outline-offset: 3px;
}
.circuit-figure svg { display: block; width: 640px; min-width: 640px; max-width: none; margin: 0 auto; }
.circuit-figure figcaption {
  display: block; margin: .6rem 0 0; max-width: none; text-align: left;
  color: var(--dg-muted); font-style: normal; font-size: 14px; line-height: 1.6;
}
.circuit-figure figcaption strong { color: var(--dg-ink); font-weight: 600; }
.circuit-figure .dg-zone { fill: var(--dg-paper); stroke: var(--dg-rule); stroke-width: 1.2; }
.circuit-figure .dg-box { fill: var(--dg-paper); stroke: var(--dg-rule); stroke-width: 1.2; }
.circuit-figure .dg-store { fill: var(--dg-surface); stroke: var(--dg-rule); stroke-width: 1.2; }
.circuit-figure .dg-focus { fill: var(--dg-tint); stroke: var(--dg-accent); stroke-width: 1.4; }
.circuit-figure .dg-label { fill: var(--dg-paper); stroke: none; }
.circuit-figure text { fill: var(--dg-ink); font-family: var(--md-text-font-family, 'Noto Sans', sans-serif); font-size: 16px; }
.circuit-figure .dg-name { font-weight: 600; }
.circuit-figure .dg-small { font-size: 14px; fill: var(--dg-muted); }
.circuit-figure .dg-code { font-family: var(--md-code-font-family, 'Ubuntu Mono', monospace); font-size: 14px; fill: var(--dg-muted); }
.circuit-figure .dg-tag { font-size: 12px; font-weight: 600; letter-spacing: .06em; fill: var(--dg-muted); }
.circuit-figure .dg-edge { fill: none; stroke: var(--dg-muted); stroke-width: 1.5; }
.circuit-figure .dg-marker { fill: var(--dg-muted); }
.circuit-figure .dg-marker-accent { fill: var(--dg-accent); }
.circuit-figure .dg-rule { stroke: var(--dg-rule); stroke-width: 1; }
.circuit-figure .dg-wave { fill: none; stroke: var(--dg-ink); stroke-width: 1.5; }
.circuit-figure .dg-wave-focus { fill: none; stroke: var(--dg-accent); stroke-width: 2; }</style>
<defs>
<marker id="sram-access-chain-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M 0 0 L 8 3 L 0 6 Z" class="dg-marker"/></marker>
<marker id="sram-access-chain-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M 0 0 L 8 3 L 0 6 Z" class="dg-marker-accent"/></marker>
<marker id="sram-access-chain-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M 0 0 L 8 3 L 0 6 Z" class="dg-marker"/></marker>
</defs>
<rect width="640" height="200" fill="var(--dg-paper)"/>
<text x="40" y="40" class="dg-tag" text-anchor="start">INPUTS STEADY</text>
<text x="600" y="40" class="dg-tag" text-anchor="end">READY</text>
<rect data-node="settle" x="40" y="72" width="112" height="48" rx="4" class="dg-box"/>
<text x="96" y="102" class="dg-small" text-anchor="middle">Settle</text>
<text x="96" y="144" class="dg-code" text-anchor="middle">settle</text>
<text x="96" y="162" class="dg-code" text-anchor="middle">interval</text>
<rect data-node="precharge" x="152" y="72" width="112" height="48" rx="4" class="dg-box"/>
<text x="208" y="102" class="dg-small" text-anchor="middle">Precharge</text>
<text x="208" y="144" class="dg-code" text-anchor="middle">precharge</text>
<text x="208" y="162" class="dg-code" text-anchor="middle">interval</text>
<rect data-node="decode" x="264" y="72" width="112" height="48" rx="4" class="dg-box"/>
<text x="320" y="102" class="dg-small" text-anchor="middle">Decode</text>
<text x="320" y="144" class="dg-code" text-anchor="middle">decoder</text>
<text x="320" y="162" class="dg-code" text-anchor="middle">replica</text>
<rect data-node="bitline" x="376" y="72" width="112" height="48" rx="4" class="dg-focus"/>
<text x="432" y="102" class="dg-small" text-anchor="middle">Bitline</text>
<text x="432" y="144" class="dg-code" text-anchor="middle">bitline</text>
<text x="432" y="162" class="dg-code" text-anchor="middle">interval</text>
<rect data-node="sense, output" x="488" y="72" width="112" height="48" rx="4" class="dg-box"/>
<text x="544" y="102" class="dg-small" text-anchor="middle">Sense, output</text>
<text x="544" y="144" class="dg-code" text-anchor="middle">sense</text>
<text x="544" y="162" class="dg-code" text-anchor="middle">+ output</text>
<path class="dg-edge" d="M 40 184 L 600 184"/>
</svg>
</div>
<figcaption><strong>Each stage starts when the previous one ends.</strong> Any change of the inputs clears every stage at once and the chain restarts. The intervals come from the timing profile (the bitline grows with the number of rows); the decode and output stages are replica gate chains as deep as the paths they copy. Widths are not to scale. The controller counts whole clock cycles around this, chosen from the proven access time.</figcaption>
</figure>
<!-- diagram:end -->
</body>
</html>
