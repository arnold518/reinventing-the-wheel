<!DOCTYPE html>
<html lang="en" class="diagram-standalone">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Writeback chooses one source</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600&amp;family=Ubuntu+Mono&amp;display=swap" rel="stylesheet"/>
<style>body { margin: 24px auto; max-width: 688px; padding: 0 16px; } * { box-sizing: border-box; }</style>
</head>
<body>
<!-- diagram:start -->
<figure class="circuit-figure" data-diagram="single-cycle-writeback">
<div class="diagram-viewport" role="region" aria-label="Writeback chooses one source" tabindex="0">
<svg viewBox="0 0 640 344" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="single-cycle-writeback-title single-cycle-writeback-desc">
<title id="single-cycle-writeback-title">Writeback chooses one source</title>
<desc id="single-cycle-writeback-desc">Writeback selects PC plus four, the ALU result, loaded data, or zero and sends WB_VALUE to the register file in Decode.</desc>
<style>.circuit-figure {
  --dg-paper: var(--md-default-bg-color, #fff);
  --dg-ink: var(--md-default-fg-color, #202735);
  --dg-muted: #566174;
  --dg-rule: #c8ced8;
  --dg-surface: #f5f6f9;
  --dg-accent: #4051b5;
  --dg-tint: #eef0fc;
  margin: 1.5rem 0; max-width: 100%; text-align: left;
  font-family: var(--md-text-font-family, 'Noto Sans', sans-serif);
}
[data-md-color-scheme="slate"] .circuit-figure {
  --dg-muted: #b4bdd0; --dg-rule: #4b5569; --dg-surface: #262c38;
  --dg-accent: #acb7ff; --dg-tint: #303853;
}
@media (prefers-color-scheme: dark) {
  .diagram-standalone .circuit-figure {
    --dg-paper: #1e2129; --dg-ink: #e4e7ef; --dg-muted: #b4bdd0;
    --dg-rule: #4b5569; --dg-surface: #262c38;
    --dg-accent: #acb7ff; --dg-tint: #303853;
  }
  .diagram-standalone body { background: #1e2129; color: #e4e7ef; }
}
.circuit-figure .diagram-viewport {
  max-width: 100%; overflow: auto; overscroll-behavior-x: contain;
}
.circuit-figure .diagram-viewport:focus-visible {
  outline: 2px solid var(--dg-accent); outline-offset: 3px;
}
.circuit-figure svg { display: block; width: 640px; min-width: 640px; max-width: none; margin: 0 auto; }
.circuit-figure figcaption {
  display: block; margin: .6rem 0 0; max-width: none; text-align: left;
  color: var(--dg-muted); font-style: normal; font-size: 14px; line-height: 1.6;
}
.circuit-figure figcaption strong { color: var(--dg-ink); font-weight: 600; }
.circuit-figure .dg-zone { fill: var(--dg-paper); stroke: var(--dg-rule); stroke-width: 1.2; }
.circuit-figure .dg-box { fill: var(--dg-paper); stroke: var(--dg-rule); stroke-width: 1.2; }
.circuit-figure .dg-store { fill: var(--dg-surface); stroke: var(--dg-rule); stroke-width: 1.2; }
.circuit-figure .dg-focus { fill: var(--dg-tint); stroke: var(--dg-accent); stroke-width: 1.4; }
.circuit-figure .dg-label { fill: var(--dg-paper); stroke: none; }
.circuit-figure text { fill: var(--dg-ink); font-family: var(--md-text-font-family, 'Noto Sans', sans-serif); font-size: 16px; }
.circuit-figure .dg-name { font-weight: 600; }
.circuit-figure .dg-small { font-size: 14px; fill: var(--dg-muted); }
.circuit-figure .dg-code { font-family: var(--md-code-font-family, 'Ubuntu Mono', monospace); font-size: 14px; fill: var(--dg-muted); }
.circuit-figure .dg-tag { font-size: 12px; font-weight: 600; letter-spacing: .06em; fill: var(--dg-muted); }
.circuit-figure .dg-edge { fill: none; stroke: var(--dg-muted); stroke-width: 1.5; }
.circuit-figure .dg-marker { fill: var(--dg-muted); }
.circuit-figure .dg-marker-accent { fill: var(--dg-accent); }
.circuit-figure .dg-rule { stroke: var(--dg-rule); stroke-width: 1; }</style>
<defs>
<marker id="single-cycle-writeback-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M 0 0 L 8 3 L 0 6 Z" class="dg-marker"/></marker>
<marker id="single-cycle-writeback-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M 0 0 L 8 3 L 0 6 Z" class="dg-marker-accent"/></marker>
<marker id="single-cycle-writeback-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M 0 0 L 8 3 L 0 6 Z" class="dg-marker"/></marker>
</defs>
<rect width="640" height="344" fill="var(--dg-paper)"/>
<path class="dg-edge" d="M 224 60 L 280 60" marker-end="url(#single-cycle-writeback-arrow)"/>
<path class="dg-edge" d="M 224 132 L 280 132" marker-end="url(#single-cycle-writeback-arrow)"/>
<path class="dg-edge" d="M 224 204 L 280 204" marker-end="url(#single-cycle-writeback-arrow)"/>
<path class="dg-edge" d="M 224 276 L 280 276" marker-end="url(#single-cycle-writeback-arrow)"/>
<path class="dg-edge" d="M 416 164 L 496 164" marker-end="url(#single-cycle-writeback-arrow)"/>
<rect data-node="FETCH" x="40" y="32" width="184" height="56" rx="6" class="dg-box"/>
<text x="132.0" y="57.0" class="dg-name" text-anchor="middle">PC + 4</text>
<text x="132.0" y="79.0" class="dg-small" text-anchor="middle">FETCH</text>
<rect data-node="EXECUTE" x="40" y="104" width="184" height="56" rx="6" class="dg-box"/>
<text x="132.0" y="129.0" class="dg-name" text-anchor="middle">ALU result</text>
<text x="132.0" y="151.0" class="dg-small" text-anchor="middle">EXECUTE</text>
<rect data-node="MEMORY" x="40" y="176" width="184" height="56" rx="6" class="dg-box"/>
<text x="132.0" y="201.0" class="dg-name" text-anchor="middle">Load value</text>
<text x="132.0" y="223.0" class="dg-small" text-anchor="middle">MEMORY</text>
<rect data-node="constant" x="40" y="248" width="184" height="56" rx="6" class="dg-box"/>
<text x="132.0" y="273.0" class="dg-name" text-anchor="middle">Zero</text>
<text x="132.0" y="295.0" class="dg-small" text-anchor="middle">constant</text>
<rect data-node="WRITEBACK" x="280" y="32" width="136" height="272" rx="6" class="dg-focus"/>
<text x="348" y="148" class="dg-name" text-anchor="middle">WRITEBACK</text>
<text x="348" y="176" class="dg-small" text-anchor="middle">Select one</text>
<rect x="416" y="128" width="80" height="28" rx="0" class="dg-label"/>
<text x="456" y="148" class="dg-code" text-anchor="middle">WB_VALUE</text>
<rect data-node="register-file" x="496" y="132" width="112" height="64" rx="6" class="dg-box"/>
<text x="552.0" y="161.0" class="dg-name" text-anchor="middle">DECODE</text>
<text x="552.0" y="183.0" class="dg-small" text-anchor="middle">register file</text>
</svg>
</div>
<figcaption><strong>ALU and link results bypass Memory.</strong> DECODE.WRITEBACK_SEL selects the source. WB_VALUE is only a candidate: the register file captures it when REGISTER_WRITE permits completion.</figcaption>
</figure>
<!-- diagram:end -->
</body>
</html>
