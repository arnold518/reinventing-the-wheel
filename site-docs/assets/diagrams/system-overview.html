<!DOCTYPE html>
<html lang="en" class="diagram-standalone">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>A computer as parts on a bus</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600&amp;family=Ubuntu+Mono&amp;display=swap" rel="stylesheet"/>
<style>body { margin: 24px auto; max-width: 688px; padding: 0 16px; } * { box-sizing: border-box; }</style>
</head>
<body>
<!-- diagram:start -->
<figure class="circuit-figure" data-diagram="system-overview">
<div class="diagram-viewport" role="region" aria-label="A computer as parts on a bus" tabindex="0">
<svg viewBox="0 0 640 414" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="system-overview-title system-overview-desc">
<title id="system-overview-title">A computer as parts on a bus</title>
<desc id="system-overview-desc">The RV32IM core is two masters on the bus: an instruction port and a data port. The bus sends each request by its address to main memory, to video memory, or to one of the device register windows; devices also have pins to the outside world.</desc>
<style>.circuit-figure {
  --dg-paper: var(--md-default-bg-color, #fff);
  --dg-ink: var(--md-default-fg-color, #202735);
  --dg-muted: #566174;
  --dg-rule: #c8ced8;
  --dg-surface: #f5f6f9;
  --dg-accent: #4051b5;
  --dg-tint: #eef0fc;
  margin: 1.5rem 0; max-width: 100%; text-align: left;
  font-family: var(--md-text-font-family, 'Noto Sans', sans-serif);
}
[data-md-color-scheme="slate"] .circuit-figure {
  --dg-muted: #b4bdd0; --dg-rule: #4b5569; --dg-surface: #262c38;
  --dg-accent: #acb7ff; --dg-tint: #303853;
}
@media (prefers-color-scheme: dark) {
  .diagram-standalone .circuit-figure {
    --dg-paper: #1e2129; --dg-ink: #e4e7ef; --dg-muted: #b4bdd0;
    --dg-rule: #4b5569; --dg-surface: #262c38;
    --dg-accent: #acb7ff; --dg-tint: #303853;
  }
  .diagram-standalone body { background: #1e2129; color: #e4e7ef; }
}
.circuit-figure .diagram-viewport {
  max-width: 100%; overflow: auto; overscroll-behavior-x: contain;
}
.circuit-figure .diagram-viewport:focus-visible {
  outline: 2px solid var(--dg-accent); outline-offset: 3px;
}
.circuit-figure svg { display: block; width: 640px; min-width: 640px; max-width: none; margin: 0 auto; }
.circuit-figure figcaption {
  display: block; margin: .6rem 0 0; max-width: none; text-align: left;
  color: var(--dg-muted); font-style: normal; font-size: 14px; line-height: 1.6;
}
.circuit-figure figcaption strong { color: var(--dg-ink); font-weight: 600; }
.circuit-figure .dg-zone { fill: var(--dg-paper); stroke: var(--dg-rule); stroke-width: 1.2; }
.circuit-figure .dg-box { fill: var(--dg-paper); stroke: var(--dg-rule); stroke-width: 1.2; }
.circuit-figure .dg-store { fill: var(--dg-surface); stroke: var(--dg-rule); stroke-width: 1.2; }
.circuit-figure .dg-focus { fill: var(--dg-tint); stroke: var(--dg-accent); stroke-width: 1.4; }
.circuit-figure .dg-label { fill: var(--dg-paper); stroke: none; }
.circuit-figure text { fill: var(--dg-ink); font-family: var(--md-text-font-family, 'Noto Sans', sans-serif); font-size: 16px; }
.circuit-figure .dg-name { font-weight: 600; }
.circuit-figure .dg-small { font-size: 14px; fill: var(--dg-muted); }
.circuit-figure .dg-code { font-family: var(--md-code-font-family, 'Ubuntu Mono', monospace); font-size: 14px; fill: var(--dg-muted); }
.circuit-figure .dg-tag { font-size: 12px; font-weight: 600; letter-spacing: .06em; fill: var(--dg-muted); }
.circuit-figure .dg-edge { fill: none; stroke: var(--dg-muted); stroke-width: 1.5; }
.circuit-figure .dg-marker { fill: var(--dg-muted); }
.circuit-figure .dg-marker-accent { fill: var(--dg-accent); }
.circuit-figure .dg-rule { stroke: var(--dg-rule); stroke-width: 1; }
.circuit-figure .dg-wave { fill: none; stroke: var(--dg-ink); stroke-width: 1.5; }
.circuit-figure .dg-wave-focus { fill: none; stroke: var(--dg-accent); stroke-width: 2; }</style>
<defs>
<marker id="system-overview-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M 0 0 L 8 3 L 0 6 Z" class="dg-marker"/></marker>
<marker id="system-overview-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M 0 0 L 8 3 L 0 6 Z" class="dg-marker-accent"/></marker>
<marker id="system-overview-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M 0 0 L 8 3 L 0 6 Z" class="dg-marker"/></marker>
</defs>
<rect width="640" height="414" fill="var(--dg-paper)"/>
<rect data-node="core" x="40" y="32" width="560" height="56" rx="6" class="dg-focus"/>
<text x="320.0" y="57.0" class="dg-name" text-anchor="middle">RV32IM core</text>
<text x="320.0" y="79.0" class="dg-small" text-anchor="middle">IMEM_ fetch port · DMEM_ data port</text>
<path class="dg-edge" d="M 200 88 L 200 136" marker-end="url(#system-overview-arrow)"/>
<path class="dg-edge" d="M 440 88 L 440 136" marker-end="url(#system-overview-arrow)"/>
<text x="212" y="116" class="dg-tag" text-anchor="start">CPU_I</text>
<text x="452" y="116" class="dg-tag" text-anchor="start">CPU_D</text>
<rect data-node="bus" x="40" y="136" width="560" height="64" rx="6" class="dg-box"/>
<text x="320.0" y="165.0" class="dg-name" text-anchor="middle">BUS</text>
<text x="320.0" y="187.0" class="dg-small" text-anchor="middle">one router per master, an arbiter per shared target</text>
<path class="dg-edge" d="M 96 200 L 96 240" marker-end="url(#system-overview-arrow)"/>
<rect data-node="memory" x="40" y="240" width="112" height="56" rx="6" class="dg-store"/>
<text x="96.0" y="265.0" class="dg-name" text-anchor="middle">MEMORY</text>
<text x="96.0" y="287.0" class="dg-small" text-anchor="middle">I_, D_ ports</text>
<path class="dg-edge" d="M 208 200 L 208 240" marker-end="url(#system-overview-arrow)"/>
<rect data-node="console" x="152" y="240" width="112" height="56" rx="6" class="dg-box"/>
<text x="208.0" y="265.0" class="dg-name" text-anchor="middle">CONSOLE</text>
<text x="208.0" y="287.0" class="dg-small" text-anchor="middle">0x1000_0000</text>
<path class="dg-edge" d="M 320 200 L 320 240" marker-end="url(#system-overview-arrow)"/>
<rect data-node="timer" x="264" y="240" width="112" height="56" rx="6" class="dg-box"/>
<text x="320.0" y="265.0" class="dg-name" text-anchor="middle">TIMER</text>
<text x="320.0" y="287.0" class="dg-small" text-anchor="middle">0x1000_1000</text>
<path class="dg-edge" d="M 432 200 L 432 240" marker-end="url(#system-overview-arrow)"/>
<rect data-node="buttons" x="376" y="240" width="112" height="56" rx="6" class="dg-box"/>
<text x="432.0" y="265.0" class="dg-name" text-anchor="middle">BUTTONS</text>
<text x="432.0" y="287.0" class="dg-small" text-anchor="middle">0x1000_2000</text>
<path class="dg-edge" d="M 544 200 L 544 240" marker-end="url(#system-overview-arrow)"/>
<rect data-node="display" x="488" y="240" width="112" height="56" rx="6" class="dg-box"/>
<text x="544.0" y="265.0" class="dg-name" text-anchor="middle">DISPLAY</text>
<text x="544.0" y="287.0" class="dg-small" text-anchor="middle">0x1000_3000</text>
<path class="dg-edge" d="M 208 296 L 208 320" marker-end="url(#system-overview-arrow)"/>
<text x="208" y="340" class="dg-small" text-anchor="middle">host text</text>
<path class="dg-edge" d="M 432 296 L 432 320" marker-end="url(#system-overview-arrow)"/>
<text x="432" y="340" class="dg-small" text-anchor="middle">keys</text>
<path class="dg-edge" d="M 544 296 L 544 320" marker-end="url(#system-overview-arrow)"/>
<text x="544" y="340" class="dg-small" text-anchor="middle">screen</text>
<text x="40" y="372" class="dg-small" text-anchor="start">MEMORY: RAM from 0x0.</text>
<text x="40" y="394" class="dg-small" text-anchor="start">DISPLAY: registers at 0x1000_3000, video memory at 0x2000_0000.</text>
</svg>
</div>
<figcaption><strong>Everything talks through one kind of port.</strong> The core's two ports are masters; memory and devices are targets. The bus looks at each request's address and passes it to the target whose window holds it. Devices connect to the outside (a host console, keys, a screen, lights) through their own pins, not through the bus.</figcaption>
</figure>
<!-- diagram:end -->
</body>
</html>
