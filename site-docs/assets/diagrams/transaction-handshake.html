<!DOCTYPE html>
<html lang="en" class="diagram-standalone">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>A delayed read through the transaction port</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600&amp;family=Ubuntu+Mono&amp;display=swap" rel="stylesheet"/>
<style>body { margin: 24px auto; max-width: 688px; padding: 0 16px; } * { box-sizing: border-box; }</style>
</head>
<body>
<!-- diagram:start -->
<figure class="circuit-figure" data-diagram="transaction-handshake">
<div class="diagram-viewport" role="region" aria-label="A delayed read through the transaction port" tabindex="0">
<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="transaction-handshake-title transaction-handshake-desc">
<title id="transaction-handshake-title">A delayed read through the transaction port</title>
<desc id="transaction-handshake-desc">Signal levels across six clock cycles: the request transfers at the first edge, the response appears later, waits for RSP_READY, and transfers at the edge where RSP_READY is high; REQ_READY never depends on RSP_READY in the same cycle.</desc>
<style>.circuit-figure {
  --dg-paper: var(--md-default-bg-color, #fff);
  --dg-ink: var(--md-default-fg-color, #202735);
  --dg-muted: #566174;
  --dg-rule: #c8ced8;
  --dg-surface: #f5f6f9;
  --dg-accent: #4051b5;
  --dg-tint: #eef0fc;
  margin: 1.5rem 0; max-width: 100%; text-align: left;
  font-family: var(--md-text-font-family, 'Noto Sans', sans-serif);
}
[data-md-color-scheme="slate"] .circuit-figure {
  --dg-muted: #b4bdd0; --dg-rule: #4b5569; --dg-surface: #262c38;
  --dg-accent: #acb7ff; --dg-tint: #303853;
}
@media (prefers-color-scheme: dark) {
  .diagram-standalone .circuit-figure {
    --dg-paper: #1e2129; --dg-ink: #e4e7ef; --dg-muted: #b4bdd0;
    --dg-rule: #4b5569; --dg-surface: #262c38;
    --dg-accent: #acb7ff; --dg-tint: #303853;
  }
  .diagram-standalone body { background: #1e2129; color: #e4e7ef; }
}
.circuit-figure .diagram-viewport {
  max-width: 100%; overflow: auto; overscroll-behavior-x: contain;
}
.circuit-figure .diagram-viewport:focus-visible {
  outline: 2px solid var(--dg-accent); outline-offset: 3px;
}
.circuit-figure svg { display: block; width: 640px; min-width: 640px; max-width: none; margin: 0 auto; }
.circuit-figure figcaption {
  display: block; margin: .6rem 0 0; max-width: none; text-align: left;
  color: var(--dg-muted); font-style: normal; font-size: 14px; line-height: 1.6;
}
.circuit-figure figcaption strong { color: var(--dg-ink); font-weight: 600; }
.circuit-figure .dg-zone { fill: var(--dg-paper); stroke: var(--dg-rule); stroke-width: 1.2; }
.circuit-figure .dg-box { fill: var(--dg-paper); stroke: var(--dg-rule); stroke-width: 1.2; }
.circuit-figure .dg-store { fill: var(--dg-surface); stroke: var(--dg-rule); stroke-width: 1.2; }
.circuit-figure .dg-focus { fill: var(--dg-tint); stroke: var(--dg-accent); stroke-width: 1.4; }
.circuit-figure .dg-label { fill: var(--dg-paper); stroke: none; }
.circuit-figure text { fill: var(--dg-ink); font-family: var(--md-text-font-family, 'Noto Sans', sans-serif); font-size: 16px; }
.circuit-figure .dg-name { font-weight: 600; }
.circuit-figure .dg-small { font-size: 14px; fill: var(--dg-muted); }
.circuit-figure .dg-code { font-family: var(--md-code-font-family, 'Ubuntu Mono', monospace); font-size: 14px; fill: var(--dg-muted); }
.circuit-figure .dg-tag { font-size: 12px; font-weight: 600; letter-spacing: .06em; fill: var(--dg-muted); }
.circuit-figure .dg-edge { fill: none; stroke: var(--dg-muted); stroke-width: 1.5; }
.circuit-figure .dg-marker { fill: var(--dg-muted); }
.circuit-figure .dg-marker-accent { fill: var(--dg-accent); }
.circuit-figure .dg-rule { stroke: var(--dg-rule); stroke-width: 1; }
.circuit-figure .dg-wave { fill: none; stroke: var(--dg-ink); stroke-width: 1.5; }
.circuit-figure .dg-wave-focus { fill: none; stroke: var(--dg-accent); stroke-width: 2; }</style>
<defs>
<marker id="transaction-handshake-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M 0 0 L 8 3 L 0 6 Z" class="dg-marker"/></marker>
<marker id="transaction-handshake-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M 0 0 L 8 3 L 0 6 Z" class="dg-marker-accent"/></marker>
<marker id="transaction-handshake-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M 0 0 L 8 3 L 0 6 Z" class="dg-marker"/></marker>
</defs>
<rect width="640" height="360" fill="var(--dg-paper)"/>
<path class="dg-edge" d="M 232 36 L 232 316"/>
<path class="dg-edge" d="M 304 36 L 304 316"/>
<path class="dg-edge" d="M 376 36 L 376 316"/>
<path class="dg-edge" d="M 448 36 L 448 316"/>
<path class="dg-edge" d="M 520 36 L 520 316"/>
<text x="144" y="72" class="dg-code" text-anchor="end">CLK</text>
<path class="dg-wave" d="M 160 80 L 160 56 L 196 56 L 196 80 L 232 80 L 232 56 L 268 56 L 268 80 L 304 80 L 304 56 L 340 56 L 340 80 L 376 80 L 376 56 L 412 56 L 412 80 L 448 80 L 448 56 L 484 56 L 484 80 L 520 80 L 520 56 L 556 56 L 556 80 L 592 80"/>
<text x="144" y="124" class="dg-code" text-anchor="end">REQ_VALID</text>
<path class="dg-wave" d="M 160 108 L 196 108 L 232 108 L 232 132 L 268 132 L 304 132 L 340 132 L 376 132 L 412 132 L 448 132 L 484 132 L 520 132 L 556 132 L 592 132"/>
<text x="144" y="176" class="dg-code" text-anchor="end">REQ_READY</text>
<path class="dg-wave-focus" d="M 160 160 L 196 160 L 232 160 L 232 184 L 268 184 L 304 184 L 340 184 L 376 184 L 376 160 L 412 160 L 448 160 L 448 184 L 484 184 L 520 184 L 520 160 L 556 160 L 592 160"/>
<text x="144" y="228" class="dg-code" text-anchor="end">RSP_VALID</text>
<path class="dg-wave" d="M 160 236 L 196 236 L 232 236 L 268 236 L 304 236 L 340 236 L 376 236 L 376 212 L 412 212 L 448 212 L 484 212 L 520 212 L 520 236 L 556 236 L 592 236"/>
<text x="144" y="280" class="dg-code" text-anchor="end">RSP_READY</text>
<path class="dg-wave" d="M 160 288 L 196 288 L 232 288 L 268 288 L 304 288 L 340 288 L 376 288 L 412 288 L 448 288 L 448 264 L 484 264 L 520 264 L 556 264 L 592 264"/>
<rect x="192" y="316" width="80" height="24" rx="0" class="dg-label"/>
<text x="232" y="332" class="dg-tag" text-anchor="middle">request</text>
<rect x="480" y="316" width="80" height="24" rx="0" class="dg-label"/>
<text x="520" y="332" class="dg-tag" text-anchor="middle">response</text>
</svg>
</div>
<figcaption><strong>Transfers happen at rising edges where VALID and READY are both high</strong> (marked). <code>REQ_READY</code> follows registered state only: it is high again in the cycle the response appears, since a new request may start as the old one completes, and low while the response is held because the requester keeps <code>RSP_READY</code> low.</figcaption>
</figure>
<!-- diagram:end -->
</body>
</html>
