<title id="matrix-unit-overview-title">The matrix unit on the bus</title>
<desc id="matrix-unit-overview-desc">The RV32IM core and the matrix unit share the bus. The core writes commands into the unit's registers; the unit's copy engine reads operands from main memory as a second bus master, the systolic array multiplies, the requantizers turn sums into bytes, and the copy engine stores results back.</desc>

<figcaption><strong>A device with its own master port.</strong> The core writes four arguments and a command; the command waits in a queue until the sequencer starts the engine it names. The copy engine moves bytes between main memory and the buffers through the unit's DMA port; the array, the requantizers and the lanes work on the buffers only.</figcaption>
