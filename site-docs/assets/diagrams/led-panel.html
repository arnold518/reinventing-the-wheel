<!DOCTYPE html>
<html lang="en" class="diagram-standalone">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>LED panel</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600&amp;family=Ubuntu+Mono&amp;display=swap" rel="stylesheet"/>
<style>body { margin: 24px auto; max-width: 688px; padding: 0 16px; } * { box-sizing: border-box; }</style>
</head>
<body>
<!-- diagram:start -->
<figure class="circuit-figure" data-diagram="led-panel">
<div class="diagram-viewport" role="region" aria-label="LED panel" tabindex="0">
<svg viewBox="0 0 640 232" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="led-panel-title led-panel-desc">
<title id="led-panel-title">LED panel</title>
<desc id="led-panel-desc">The LED panel&#x27;s register front end stores LEDS and BLINK; a free-running counter and a 32-to-1 multiplexer pick the blink phase; sixteen AND gates drive the LED pins.</desc>
<style>.circuit-figure {
  --dg-paper: var(--md-default-bg-color, #fff);
  --dg-ink: var(--md-default-fg-color, #202735);
  --dg-muted: #566174;
  --dg-rule: #c8ced8;
  --dg-surface: #f5f6f9;
  --dg-accent: #4051b5;
  --dg-tint: #eef0fc;
  margin: 1.5rem 0; max-width: 100%; text-align: left;
  font-family: var(--md-text-font-family, 'Noto Sans', sans-serif);
}
[data-md-color-scheme="slate"] .circuit-figure {
  --dg-muted: #b4bdd0; --dg-rule: #4b5569; --dg-surface: #262c38;
  --dg-accent: #acb7ff; --dg-tint: #303853;
}
@media (prefers-color-scheme: dark) {
  .diagram-standalone .circuit-figure {
    --dg-paper: #1e2129; --dg-ink: #e4e7ef; --dg-muted: #b4bdd0;
    --dg-rule: #4b5569; --dg-surface: #262c38;
    --dg-accent: #acb7ff; --dg-tint: #303853;
  }
  .diagram-standalone body { background: #1e2129; color: #e4e7ef; }
}
.circuit-figure .diagram-viewport {
  max-width: 100%; overflow: auto; overscroll-behavior-x: contain;
}
.circuit-figure .diagram-viewport:focus-visible {
  outline: 2px solid var(--dg-accent); outline-offset: 3px;
}
.circuit-figure svg { display: block; width: 640px; min-width: 640px; max-width: none; margin: 0 auto; }
.circuit-figure figcaption {
  display: block; margin: .6rem 0 0; max-width: none; text-align: left;
  color: var(--dg-muted); font-style: normal; font-size: 14px; line-height: 1.6;
}
.circuit-figure figcaption strong { color: var(--dg-ink); font-weight: 600; }
.circuit-figure .dg-zone { fill: var(--dg-paper); stroke: var(--dg-rule); stroke-width: 1.2; }
.circuit-figure .dg-box { fill: var(--dg-paper); stroke: var(--dg-rule); stroke-width: 1.2; }
.circuit-figure .dg-store { fill: var(--dg-surface); stroke: var(--dg-rule); stroke-width: 1.2; }
.circuit-figure .dg-focus { fill: var(--dg-tint); stroke: var(--dg-accent); stroke-width: 1.4; }
.circuit-figure .dg-label { fill: var(--dg-paper); stroke: none; }
.circuit-figure text { fill: var(--dg-ink); font-family: var(--md-text-font-family, 'Noto Sans', sans-serif); font-size: 16px; }
.circuit-figure .dg-name { font-weight: 600; }
.circuit-figure .dg-small { font-size: 14px; fill: var(--dg-muted); }
.circuit-figure .dg-code { font-family: var(--md-code-font-family, 'Ubuntu Mono', monospace); font-size: 14px; fill: var(--dg-muted); }
.circuit-figure .dg-tag { font-size: 12px; font-weight: 600; letter-spacing: .06em; fill: var(--dg-muted); }
.circuit-figure .dg-edge { fill: none; stroke: var(--dg-muted); stroke-width: 1.5; }
.circuit-figure .dg-marker { fill: var(--dg-muted); }
.circuit-figure .dg-marker-accent { fill: var(--dg-accent); }
.circuit-figure .dg-rule { stroke: var(--dg-rule); stroke-width: 1; }
.circuit-figure .dg-wave { fill: none; stroke: var(--dg-ink); stroke-width: 1.5; }
.circuit-figure .dg-wave-focus { fill: none; stroke: var(--dg-accent); stroke-width: 2; }</style>
<defs>
<marker id="led-panel-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M 0 0 L 8 3 L 0 6 Z" class="dg-marker"/></marker>
<marker id="led-panel-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M 0 0 L 8 3 L 0 6 Z" class="dg-marker-accent"/></marker>
<marker id="led-panel-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M 0 0 L 8 3 L 0 6 Z" class="dg-marker"/></marker>
</defs>
<rect width="640" height="232" fill="var(--dg-paper)"/>
<rect data-node="port" x="24" y="40" width="112" height="56" rx="6" class="dg-box"/>
<text x="80.0" y="73.0" class="dg-name" text-anchor="middle">PORT</text>
<path class="dg-edge" d="M 136 68 L 168 68" marker-end="url(#led-panel-arrow)"/>
<rect data-node="regs" x="168" y="40" width="152" height="56" rx="6" class="dg-focus"/>
<text x="244.0" y="65.0" class="dg-name" text-anchor="middle">REGISTERS</text>
<text x="244.0" y="87.0" class="dg-small" text-anchor="middle">LEDS · BLINK</text>
<rect data-node="count" x="168" y="136" width="152" height="56" rx="6" class="dg-store"/>
<text x="244.0" y="161.0" class="dg-name" text-anchor="middle">BLINK_COUNTER</text>
<text x="244.0" y="183.0" class="dg-small" text-anchor="middle">32 bits</text>
<rect data-node="mux" x="360" y="136" width="104" height="56" rx="6" class="dg-box"/>
<text x="412.0" y="161.0" class="dg-name" text-anchor="middle">PHASE</text>
<text x="412.0" y="183.0" class="dg-small" text-anchor="middle">32 : 1</text>
<path class="dg-edge" d="M 320 164 L 360 164" marker-end="url(#led-panel-arrow)"/>
<path class="dg-edge" d="M 296 96 L 296 116 L 412 116 L 412 136" marker-end="url(#led-panel-arrow)"/>
<rect data-node="and" x="504" y="40" width="112" height="56" rx="6" class="dg-box"/>
<text x="560.0" y="65.0" class="dg-name" text-anchor="middle">LIGHTS</text>
<text x="560.0" y="87.0" class="dg-small" text-anchor="middle">16 × AND</text>
<path class="dg-edge" d="M 320 60 L 504 60" marker-end="url(#led-panel-arrow)"/>
<path class="dg-edge" d="M 464 164 L 560 164 L 560 96" marker-end="url(#led-panel-arrow)"/>
<path class="dg-edge" d="M 616 68 L 632 68" marker-end="url(#led-panel-arrow)"/>
<text x="424" y="52" class="dg-tag" text-anchor="start">LEDS</text>
<text x="420" y="130" class="dg-tag" text-anchor="start">BLINK</text>
</svg>
</div>
<figcaption><strong>Two registers and a counter.</strong> LEDS and BLINK live in the front end, built from the two-row table. When BLINK is k > 0, counter bit k picks whether the lit LEDs show: on for 2<sup>k</sup> cycles, off for 2<sup>k</sup>.</figcaption>
</figure>
<!-- diagram:end -->
</body>
</html>
