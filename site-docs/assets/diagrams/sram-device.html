<!DOCTYPE html>
<html lang="en" class="diagram-standalone">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Inside the SRAM device</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600&amp;family=Ubuntu+Mono&amp;display=swap" rel="stylesheet"/>
<style>body { margin: 24px auto; max-width: 688px; padding: 0 16px; } * { box-sizing: border-box; }</style>

<body>
<!-- diagram:start -->
<figure class="circuit-figure" data-diagram="sram-device">
<div class="diagram-viewport" role="region" aria-label="Inside the SRAM device" tabindex="0">
<svg viewBox="0 0 640 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sram-device-title sram-device-desc">
<title id="sram-device-title">Inside the SRAM device</title>
<desc id="sram-device-desc">The SRAM device: access control and the row decoder on the left drive the storage bank&#x27;s wordlines, precharge sits above the bank, and column selection, write drivers and sense amplifiers sit below it, ending in the output buffer.</desc>
<style>.circuit-figure {
  --dg-paper: var(--md-default-bg-color, #fff);
  --dg-ink: var(--md-default-fg-color, #202735);
  --dg-muted: #566174;
  --dg-rule: #c8ced8;
  --dg-surface: #f5f6f9;
  --dg-accent: #4051b5;
  --dg-tint: #eef0fc;
  margin: 1.5rem 0; max-width: 100%; text-align: left;
  font-family: var(--md-text-font-family, 'Noto Sans', sans-serif);
}
[data-md-color-scheme="slate"] .circuit-figure {
  --dg-muted: #b4bdd0; --dg-rule: #4b5569; --dg-surface: #262c38;
  --dg-accent: #acb7ff; --dg-tint: #303853;
}
@media (prefers-color-scheme: dark) {
  .diagram-standalone .circuit-figure {
    --dg-paper: #1e2129; --dg-ink: #e4e7ef; --dg-muted: #b4bdd0;
    --dg-rule: #4b5569; --dg-surface: #262c38;
    --dg-accent: #acb7ff; --dg-tint: #303853;
  }
  .diagram-standalone body { background: #1e2129; color: #e4e7ef; }
}
.circuit-figure .diagram-viewport {
  max-width: 100%; overflow: auto; overscroll-behavior-x: contain;
}
.circuit-figure .diagram-viewport:focus-visible {
  outline: 2px solid var(--dg-accent); outline-offset: 3px;
}
.circuit-figure svg { display: block; width: 640px; min-width: 640px; max-width: none; margin: 0 auto; }
.circuit-figure figcaption {
  display: block; margin: .6rem 0 0; max-width: none; text-align: left;
  color: var(--dg-muted); font-style: normal; font-size: 14px; line-height: 1.6;
}
.circuit-figure figcaption strong { color: var(--dg-ink); font-weight: 600; }
.circuit-figure .dg-zone { fill: var(--dg-paper); stroke: var(--dg-rule); stroke-width: 1.2; }
.circuit-figure .dg-box { fill: var(--dg-paper); stroke: var(--dg-rule); stroke-width: 1.2; }
.circuit-figure .dg-store { fill: var(--dg-surface); stroke: var(--dg-rule); stroke-width: 1.2; }
.circuit-figure .dg-focus { fill: var(--dg-tint); stroke: var(--dg-accent); stroke-width: 1.4; }
.circuit-figure .dg-label { fill: var(--dg-paper); stroke: none; }
.circuit-figure text { fill: var(--dg-ink); font-family: var(--md-text-font-family, 'Noto Sans', sans-serif); font-size: 16px; }
.circuit-figure .dg-name { font-weight: 600; }
.circuit-figure .dg-small { font-size: 14px; fill: var(--dg-muted); }
.circuit-figure .dg-code { font-family: var(--md-code-font-family, 'Ubuntu Mono', monospace); font-size: 14px; fill: var(--dg-muted); }
.circuit-figure .dg-tag { font-size: 12px; font-weight: 600; letter-spacing: .06em; fill: var(--dg-muted); }
.circuit-figure .dg-edge { fill: none; stroke: var(--dg-muted); stroke-width: 1.5; }
.circuit-figure .dg-marker { fill: var(--dg-muted); }
.circuit-figure .dg-marker-accent { fill: var(--dg-accent); }
.circuit-figure .dg-rule { stroke: var(--dg-rule); stroke-width: 1; }
.circuit-figure .dg-wave { fill: none; stroke: var(--dg-ink); stroke-width: 1.5; }
.circuit-figure .dg-wave-focus { fill: none; stroke: var(--dg-accent); stroke-width: 2; }</style>
<defs>
<marker id="sram-device-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M 0 0 L 8 3 L 0 6 Z" class="dg-marker"/></marker>
<marker id="sram-device-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M 0 0 L 8 3 L 0 6 Z" class="dg-marker-accent"/></marker>
<marker id="sram-device-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M 0 0 L 8 3 L 0 6 Z" class="dg-marker"/></marker>

<rect width="640" height="440" fill="var(--dg-paper)"/>
<rect data-node="ACCESS_CONTROL" x="40" y="48" width="144" height="72" rx="6" class="dg-focus"/>
<text x="112.0" y="81.0" class="dg-name" text-anchor="middle">ACCESS_CONTROL</text>
<text x="112.0" y="103.0" class="dg-small" text-anchor="middle">timing · READY</text>

<text x="420.0" y="77.0" class="dg-name" text-anchor="middle">PRECHARGE</text>
<rect data-node="STORAGE" x="240" y="116" width="360" height="176" rx="6" class="dg-store"/>
<text x="256" y="144" class="dg-name" text-anchor="start">STORAGE</text>
<text x="256" y="168" class="dg-code" text-anchor="start">SRAMStorageBank: rows × bitline pairs</text>
<rect x="256" y="188" width="328" height="20" rx="2" class="dg-box"/>
<rect x="256" y="220" width="328" height="20" rx="2" class="dg-box"/>
<rect x="256" y="252" width="328" height="20" rx="2" class="dg-box"/>

<text x="324.0" y="341.0" class="dg-name" text-anchor="middle">COLUMN_SELECT</text>
<rect data-node="WRITE_SENSE" x="432" y="312" width="168" height="48" rx="6" class="dg-box"/>
<text x="516.0" y="341.0" class="dg-name" text-anchor="middle">WRITE / SENSE</text>
<rect data-node="OUTPUT" x="432" y="380" width="168" height="40" rx="6" class="dg-box"/>
<text x="516.0" y="405.0" class="dg-name" text-anchor="middle">OUTPUT</text>
<path class="dg-edge" d="M 184 236 L 240 236" marker-end="url(#sram-device-arrow)"/>
<path class="dg-edge" d="M 112 120 L 112 180" marker-end="url(#sram-device-arrow)"/>
<path class="dg-edge" d="M 184 72 L 240 72" marker-end="url(#sram-device-arrow)"/>
<path class="dg-edge" d="M 516 360 L 516 380" marker-end="url(#sram-device-arrow)"/>
<path class="dg-edge" d="M 408 336 L 432 336" marker-end="url(#sram-device-arrow)"/>

<path class="dg-edge" d="M 516 292 L 516 312"/>
</svg>
</div>
<figcaption><strong>Rows across, bitline pairs down.</strong> <code>ACCESS_CONTROL</code> times each access and raises <code>READY</code>; the decoder opens one row; each column's bitline pair is precharged above the bank and sensed or driven below it. An array of more than 32 rows repeats this block as subarrays joined by global wires.</figcaption>
</figure>
<!-- diagram:end -->
</body>
</html>
