<!DOCTYPE html>
<html lang="en" class="diagram-standalone">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Prediction travels with the instruction</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600&amp;family=Ubuntu+Mono&amp;display=swap" rel="stylesheet"/>
<style>body { margin: 24px auto; max-width: 688px; padding: 0 16px; } * { box-sizing: border-box; }</style>
</head>
<body>
<!-- diagram:start -->
<figure class="circuit-figure" data-diagram="advanced-prediction">
<div class="diagram-viewport" role="region" aria-label="Prediction travels with the instruction" tabindex="0">
<svg viewBox="0 0 640 504" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="advanced-prediction-title advanced-prediction-desc">
<title id="advanced-prediction-title">Prediction travels with the instruction</title>
<desc id="advanced-prediction-desc">Fetch predecodes a target and predicts a next PC. The prediction is captured in IF/ID then ID/EX alongside its instruction. Recovery compares both Execute candidate addresses in parallel, then selects the mismatch using the branch or jump decision.</desc>
<style>.circuit-figure {
  --dg-paper: var(--md-default-bg-color, #fff);
  --dg-ink: var(--md-default-fg-color, #202735);
  --dg-muted: #566174;
  --dg-rule: #c8ced8;
  --dg-surface: #f5f6f9;
  --dg-accent: #4051b5;
  --dg-tint: #eef0fc;
  margin: 1.5rem 0; max-width: 100%; text-align: left;
  font-family: var(--md-text-font-family, 'Noto Sans', sans-serif);
}
[data-md-color-scheme="slate"] .circuit-figure {
  --dg-muted: #b4bdd0; --dg-rule: #4b5569; --dg-surface: #262c38;
  --dg-accent: #acb7ff; --dg-tint: #303853;
}
@media (prefers-color-scheme: dark) {
  .diagram-standalone .circuit-figure {
    --dg-paper: #1e2129; --dg-ink: #e4e7ef; --dg-muted: #b4bdd0;
    --dg-rule: #4b5569; --dg-surface: #262c38;
    --dg-accent: #acb7ff; --dg-tint: #303853;
  }
  .diagram-standalone body { background: #1e2129; color: #e4e7ef; }
}
.circuit-figure .diagram-viewport {
  max-width: 100%; overflow: auto; overscroll-behavior-x: contain;
}
.circuit-figure .diagram-viewport:focus-visible {
  outline: 2px solid var(--dg-accent); outline-offset: 3px;
}
.circuit-figure svg { display: block; width: 640px; min-width: 640px; max-width: none; margin: 0 auto; }
.circuit-figure figcaption {
  display: block; margin: .6rem 0 0; max-width: none; text-align: left;
  color: var(--dg-muted); font-style: normal; font-size: 14px; line-height: 1.6;
}
.circuit-figure figcaption strong { color: var(--dg-ink); font-weight: 600; }
.circuit-figure .dg-zone { fill: var(--dg-paper); stroke: var(--dg-rule); stroke-width: 1.2; }
.circuit-figure .dg-box { fill: var(--dg-paper); stroke: var(--dg-rule); stroke-width: 1.2; }
.circuit-figure .dg-store { fill: var(--dg-surface); stroke: var(--dg-rule); stroke-width: 1.2; }
.circuit-figure .dg-focus { fill: var(--dg-tint); stroke: var(--dg-accent); stroke-width: 1.4; }
.circuit-figure .dg-label { fill: var(--dg-paper); stroke: none; }
.circuit-figure text { fill: var(--dg-ink); font-family: var(--md-text-font-family, 'Noto Sans', sans-serif); font-size: 16px; }
.circuit-figure .dg-name { font-weight: 600; }
.circuit-figure .dg-small { font-size: 14px; fill: var(--dg-muted); }
.circuit-figure .dg-code { font-family: var(--md-code-font-family, 'Ubuntu Mono', monospace); font-size: 14px; fill: var(--dg-muted); }
.circuit-figure .dg-tag { font-size: 12px; font-weight: 600; letter-spacing: .06em; fill: var(--dg-muted); }
.circuit-figure .dg-edge { fill: none; stroke: var(--dg-muted); stroke-width: 1.5; }
.circuit-figure .dg-marker { fill: var(--dg-muted); }
.circuit-figure .dg-marker-accent { fill: var(--dg-accent); }
.circuit-figure .dg-rule { stroke: var(--dg-rule); stroke-width: 1; }</style>
<defs>
<marker id="advanced-prediction-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M 0 0 L 8 3 L 0 6 Z" class="dg-marker"/></marker>
<marker id="advanced-prediction-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M 0 0 L 8 3 L 0 6 Z" class="dg-marker-accent"/></marker>
<marker id="advanced-prediction-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M 0 0 L 8 3 L 0 6 Z" class="dg-marker"/></marker>
</defs>
<rect width="640" height="504" fill="var(--dg-paper)"/>
<text x="40" y="34" class="dg-tag" text-anchor="start">FETCH · CURRENT INSTRUCTION</text>
<rect data-node="predecode" x="40" y="56" width="160" height="68" rx="6" class="dg-box"/>
<text x="120.0" y="87.0" class="dg-name" text-anchor="middle">Predecode</text>
<text x="120.0" y="109.0" class="dg-small" text-anchor="middle">PC + B/J immediate</text>
<rect data-node="predictor" x="240" y="56" width="160" height="68" rx="6" class="dg-focus"/>
<text x="320.0" y="87.0" class="dg-name" text-anchor="middle">Predictor</text>
<text x="320.0" y="109.0" class="dg-small" text-anchor="middle">choose next PC</text>
<rect data-node="if-id" x="440" y="56" width="160" height="68" rx="6" class="dg-store"/>
<text x="520.0" y="87.0" class="dg-name" text-anchor="middle">IF/ID metadata</text>
<text x="520.0" y="109.0" class="dg-small" text-anchor="middle">capture prediction</text>
<path class="dg-edge" d="M 200 90 L 240 90" marker-end="url(#advanced-prediction-arrow)"/>
<path class="dg-edge" d="M 400 90 L 440 90" marker-end="url(#advanced-prediction-arrow)"/>
<text x="40" y="162" class="dg-small" text-anchor="start">Used immediately as Fetch&#x27;s next address.</text>
<text x="40" y="186" class="dg-small" text-anchor="start">A copy follows the accepted instruction.</text>
<path class="dg-edge" d="M 520 124 L 520 240" marker-end="url(#advanced-prediction-arrow)"/>
<text x="536" y="188" class="dg-small" text-anchor="start">edge</text>
<text x="40" y="226" class="dg-tag" text-anchor="start">EXECUTE · THAT SAME INSTRUCTION</text>
<rect data-node="execute" x="40" y="240" width="160" height="68" rx="6" class="dg-box"/>
<text x="120.0" y="271.0" class="dg-name" text-anchor="middle">Execute</text>
<text x="120.0" y="293.0" class="dg-small" text-anchor="middle">candidates + taken</text>
<rect data-node="recovery" x="240" y="240" width="160" height="68" rx="6" class="dg-focus"/>
<text x="320.0" y="271.0" class="dg-name" text-anchor="middle">Recovery</text>
<text x="320.0" y="293.0" class="dg-small" text-anchor="middle">parallel compares</text>
<rect data-node="id-ex" x="440" y="240" width="160" height="68" rx="6" class="dg-store"/>
<text x="520.0" y="271.0" class="dg-name" text-anchor="middle">ID/EX metadata</text>
<text x="520.0" y="293.0" class="dg-small" text-anchor="middle">saved prediction</text>
<path class="dg-edge" d="M 200 274 L 240 274" marker-end="url(#advanced-prediction-arrow)"/>
<path class="dg-edge" d="M 440 274 L 400 274" marker-end="url(#advanced-prediction-arrow)"/>
<path class="dg-edge" d="M 320 308 L 320 374" marker-end="url(#advanced-prediction-arrow)"/>
<rect data-node="coordinator" x="208" y="374" width="224" height="72" rx="6" class="dg-focus"/>
<text x="320.0" y="407.0" class="dg-name" text-anchor="middle">Coordinator</text>
<text x="320.0" y="429.0" class="dg-small" text-anchor="middle">advance · hold · flush</text>
<text x="40" y="484" class="dg-small" text-anchor="start">On an accepted resolution: correct if needed; train conditional branches once.</text>
</svg>
</div>
<figcaption><strong>Two metadata registers, not two extra stages.</strong> They use the real IF/ID and ID/EX write enables. Recovery asks the coordinator to correct Fetch and discard younger work; a memory wait delays that action and training together.</figcaption>
</figure>
<!-- diagram:end -->
</body>
</html>
