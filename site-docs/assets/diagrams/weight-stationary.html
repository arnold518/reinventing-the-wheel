<!-- diagram:start -->
<figure class="circuit-figure" data-diagram="weight-stationary">
<div class="diagram-viewport" role="region" aria-label="A weight-stationary systolic array" tabindex="0">
<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="weight-stationary-title weight-stationary-desc">
<title id="weight-stationary-title">A weight-stationary systolic array</title>
<desc id="weight-stationary-desc">A 3 by 3 grid of multiply-add cells. Cell (i, j) holds weight W[i][j]. Input x[i] enters row i from the left, delayed i edges, and moves one cell right per edge; partial sums move one cell down per edge; column j outputs y[j] = sum over i of x[i] W[i][j], delayed so all columns leave together.</desc>

  --dg-surface: #f5f6f9;
  --dg-accent: #4051b5;

  font-family: var(--md-text-font-family, 'Noto Sans', sans-serif);
}

.circuit-figure .dg-tag { font-size: 12px; font-weight: 600; letter-spacing: .06em; fill: var(--dg-muted); }
.circuit-figure .dg-edge { fill: none; stroke: var(--dg-muted); stroke-width: 1.5; }
.circuit-figure .dg-marker { fill: var(--dg-muted); }
.circuit-figure .dg-marker-accent { fill: var(--dg-accent); }

</div>
<figcaption><strong>Weights stay, inputs move right, sums move down.</strong> Row i's input waits i edges so it meets the sum coming down from the rows above; column j's result waits N−1−j edges so a whole output vector leaves at once, 2N−2 edges after its input vector entered. One new vector can enter every edge.</figcaption>
</figure>
