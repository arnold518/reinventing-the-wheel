<title id="cache-topologies-title">Five memory arrangements over one DRAM</title>
<desc id="cache-topologies-desc">Five ways to connect a processor&#x27;s instruction and data ports to DRAM main memory: two separate memories, one shared memory through an arbiter, private level-1 caches above the arbiter, a shared level-2 cache below it, and both.</desc>

<figcaption><strong>Same requests, same DRAM, five connections.</strong> A gives each port its own copy of memory; B shares one DRAM through the two-port arbiter; C-ID adds an instruction and a data L1 above the arbiter; D-0 puts a shared L2 below it; D-ID has both.</figcaption>
