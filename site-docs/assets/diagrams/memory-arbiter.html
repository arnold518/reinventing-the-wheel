<!DOCTYPE html>
<html lang="en" class="diagram-standalone">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Two-port memory arbiter</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600&amp;family=Ubuntu+Mono&amp;display=swap" rel="stylesheet"/>
<style>body { margin: 24px auto; max-width: 688px; padding: 0 16px; } * { box-sizing: border-box; }</style>
</head>
<body>
<!-- diagram:start -->
<figure class="circuit-figure" data-diagram="memory-arbiter">
<div class="diagram-viewport" role="region" aria-label="Two-port memory arbiter" tabindex="0">
<svg viewBox="0 0 640 328" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="memory-arbiter-title memory-arbiter-desc">
<title id="memory-arbiter-title">Two-port memory arbiter</title>
<desc id="memory-arbiter-desc">Requests from ports I and D pass the grant and one multiplexer per field to the lower memory; responses pass the response route into one buffer per port; the state block holds busy, owner, priority and burst bits.</desc>
<style>.circuit-figure {
  --dg-paper: var(--md-default-bg-color, #fff);
  --dg-ink: var(--md-default-fg-color, #202735);
  --dg-muted: #566174;
  --dg-rule: #c8ced8;
  --dg-surface: #f5f6f9;
  --dg-accent: #4051b5;
  --dg-tint: #eef0fc;
  margin: 1.5rem 0; max-width: 100%; text-align: left;
  font-family: var(--md-text-font-family, 'Noto Sans', sans-serif);
}
[data-md-color-scheme="slate"] .circuit-figure {
  --dg-muted: #b4bdd0; --dg-rule: #4b5569; --dg-surface: #262c38;
  --dg-accent: #acb7ff; --dg-tint: #303853;
}
@media (prefers-color-scheme: dark) {
  .diagram-standalone .circuit-figure {
    --dg-paper: #1e2129; --dg-ink: #e4e7ef; --dg-muted: #b4bdd0;
    --dg-rule: #4b5569; --dg-surface: #262c38;
    --dg-accent: #acb7ff; --dg-tint: #303853;
  }
  .diagram-standalone body { background: #1e2129; color: #e4e7ef; }
}
.circuit-figure .diagram-viewport {
  max-width: 100%; overflow: auto; overscroll-behavior-x: contain;
}
.circuit-figure .diagram-viewport:focus-visible {
  outline: 2px solid var(--dg-accent); outline-offset: 3px;
}
.circuit-figure svg { display: block; width: 640px; min-width: 640px; max-width: none; margin: 0 auto; }
.circuit-figure figcaption {
  display: block; margin: .6rem 0 0; max-width: none; text-align: left;
  color: var(--dg-muted); font-style: normal; font-size: 14px; line-height: 1.6;
}
.circuit-figure figcaption strong { color: var(--dg-ink); font-weight: 600; }
.circuit-figure .dg-zone { fill: var(--dg-paper); stroke: var(--dg-rule); stroke-width: 1.2; }
.circuit-figure .dg-box { fill: var(--dg-paper); stroke: var(--dg-rule); stroke-width: 1.2; }
.circuit-figure .dg-store { fill: var(--dg-surface); stroke: var(--dg-rule); stroke-width: 1.2; }
.circuit-figure .dg-focus { fill: var(--dg-tint); stroke: var(--dg-accent); stroke-width: 1.4; }
.circuit-figure .dg-label { fill: var(--dg-paper); stroke: none; }
.circuit-figure text { fill: var(--dg-ink); font-family: var(--md-text-font-family, 'Noto Sans', sans-serif); font-size: 16px; }
.circuit-figure .dg-name { font-weight: 600; }
.circuit-figure .dg-small { font-size: 14px; fill: var(--dg-muted); }
.circuit-figure .dg-code { font-family: var(--md-code-font-family, 'Ubuntu Mono', monospace); font-size: 14px; fill: var(--dg-muted); }
.circuit-figure .dg-tag { font-size: 12px; font-weight: 600; letter-spacing: .06em; fill: var(--dg-muted); }
.circuit-figure .dg-edge { fill: none; stroke: var(--dg-muted); stroke-width: 1.5; }
.circuit-figure .dg-marker { fill: var(--dg-muted); }
.circuit-figure .dg-marker-accent { fill: var(--dg-accent); }
.circuit-figure .dg-rule { stroke: var(--dg-rule); stroke-width: 1; }
.circuit-figure .dg-wave { fill: none; stroke: var(--dg-ink); stroke-width: 1.5; }
.circuit-figure .dg-wave-focus { fill: none; stroke: var(--dg-accent); stroke-width: 2; }</style>
<defs>
<marker id="memory-arbiter-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M 0 0 L 8 3 L 0 6 Z" class="dg-marker"/></marker>
<marker id="memory-arbiter-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M 0 0 L 8 3 L 0 6 Z" class="dg-marker-accent"/></marker>
<marker id="memory-arbiter-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M 0 0 L 8 3 L 0 6 Z" class="dg-marker"/></marker>
</defs>
<rect width="640" height="328" fill="var(--dg-paper)"/>
<rect data-node="ports" x="40" y="56" width="96" height="120" rx="6" class="dg-box"/>
<text x="88.0" y="113.0" class="dg-name" text-anchor="middle">I, D</text>
<text x="88.0" y="135.0" class="dg-small" text-anchor="middle">ports</text>
<rect data-node="grant" x="200" y="56" width="168" height="48" rx="6" class="dg-focus"/>
<text x="284.0" y="85.0" class="dg-name" text-anchor="middle">GRANT</text>
<rect data-node="select" x="200" y="128" width="168" height="48" rx="6" class="dg-box"/>
<text x="284.0" y="157.0" class="dg-name" text-anchor="middle">SELECT_REQ_*</text>
<rect data-node="state" x="432" y="56" width="168" height="48" rx="6" class="dg-store"/>
<text x="516.0" y="85.0" class="dg-name" text-anchor="middle">STATE</text>
<rect data-node="mem" x="432" y="128" width="168" height="104" rx="6" class="dg-store"/>
<text x="516.0" y="177.0" class="dg-name" text-anchor="middle">MEM_</text>
<text x="516.0" y="199.0" class="dg-small" text-anchor="middle">endpoint or cache</text>
<rect data-node="route" x="200" y="256" width="168" height="48" rx="6" class="dg-box"/>
<text x="284.0" y="285.0" class="dg-name" text-anchor="middle">RESPONSE_ROUTE</text>
<rect data-node="buffers" x="40" y="256" width="96" height="48" rx="6" class="dg-store"/>
<text x="88.0" y="285.0" class="dg-name" text-anchor="middle">Buffers</text>
<path class="dg-edge" d="M 136 80 L 200 80" marker-end="url(#memory-arbiter-arrow)"/>
<path class="dg-edge" d="M 136 152 L 200 152" marker-end="url(#memory-arbiter-arrow)"/>
<path class="dg-edge" d="M 284 104 L 284 128" marker-end="url(#memory-arbiter-arrow)"/>
<path class="dg-edge" d="M 368 72 L 432 72" marker-end="url(#memory-arbiter-arrow)"/>
<path class="dg-edge" d="M 432 92 L 368 92" marker-end="url(#memory-arbiter-arrow)"/>
<path class="dg-edge" d="M 368 152 L 432 152" marker-end="url(#memory-arbiter-arrow)"/>
<path class="dg-edge" d="M 480 232 L 480 280 L 368 280" marker-end="url(#memory-arbiter-arrow)"/>
<path class="dg-edge" d="M 200 280 L 136 280" marker-end="url(#memory-arbiter-arrow)"/>
<path class="dg-edge" d="M 88 256 L 88 176" marker-end="url(#memory-arbiter-arrow)"/>
<text x="400" y="64" class="dg-tag" text-anchor="middle">ACCEPT</text>
<text x="400" y="112" class="dg-tag" text-anchor="middle">BUSY</text>
<text x="400" y="144" class="dg-tag" text-anchor="middle">REQ</text>
<text x="492" y="260" class="dg-tag" text-anchor="start">RESPONSE</text>
<text x="100" y="220" class="dg-tag" text-anchor="start">RSP</text>
</svg>
</div>
<figcaption><strong>Request path above, response path below.</strong> The grant chooses I or D and switches the request multiplexers; the state remembers who owns the request in flight and who goes first next. A response goes into its owner's buffer, so a port that is not ready cannot hold the lower memory.</figcaption>
</figure>
<!-- diagram:end -->
</body>
</html>
