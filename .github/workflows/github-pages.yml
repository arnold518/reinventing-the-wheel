name: Deploy documentation and visualizer to GitHub Pages
on:
  push:
    branches:
      - alpha
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Cache Emscripten SDK
        uses: actions/cache@v4
        with:
          path: ${{ runner.tool_cache }}/emsdk
          key: emsdk-6.0.7-${{ runner.os }}

      - name: Install Emscripten 6.0.7
        shell: bash
        run: |
          EMSDK_DIR="${{ runner.tool_cache }}/emsdk"
          if [ ! -d "$EMSDK_DIR/.git" ]; then
            git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$EMSDK_DIR"
          fi
          "$EMSDK_DIR/emsdk" install 6.0.7
          "$EMSDK_DIR/emsdk" activate 6.0.7

      - name: Install site-test dependencies
        run: >-
          python3 -m pip install
          -r requirements-docs.txt
          playwright==1.60.0

      - name: Build combined GitHub Pages site
        shell: bash
        run: |
          source "${{ runner.tool_cache }}/emsdk/emsdk_env.sh"
          tools/build-pages.sh

      - name: Test packaged site and WebAssembly
        run: >-
          python3 tools/run-web-tests.py --suite smoke
          --wasm-dir build-wasm --browser-python python3
          --output build/validation/pages-smoke

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build-wasm/site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
