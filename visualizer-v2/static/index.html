<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CircuitSim Visualizer V2</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css?v=30">
</head>
<body>
  <canvas id="circuit-canvas"></canvas>

  <div id="topbar" class="toolbar">
    <div class="scenario-control">
      <label class="field field-scenario">
        <span class="field-label scenario-label">Scenario</span>
        <select id="scenario-select"></select>
      </label>
      <div id="program-controls" class="hidden">
        <label class="field">
          <span class="field-label">Core</span>
          <select id="program-core">
            <option value="single">Single-cycle</option>
            <option value="baseline">Baseline pipeline</option>
            <option value="advanced">Advanced pipeline</option>
          </select>
        </label>
        <label class="field">
          <span class="field-label">Prediction</span>
          <select id="program-policy">
            <option value="not-taken">Not taken</option>
            <option value="taken">Taken</option>
            <option value="backward-taken">Backward taken</option>
            <option value="one-bit">One-bit</option>
            <option value="two-bit">Two-bit</option>
          </select>
        </label>
      </div>
      <label class="field field-timing" title="Gate and memory delays the circuit is built and simulated with">
        <span class="field-label">Timing</span>
        <select id="timing-select">
          <option value="unit">unit (1 tick per gate)</option>
          <option value="embedded">embedded (65 nm, ps)</option>
          <option value="desktop">desktop (32 nm, ps)</option>
        </select>
      </label>
    </div>
    <div class="timeline-controls" aria-label="Simulation controls">
      <button id="checkpoint-back" class="icon-button" title="Previous checkpoint" aria-label="Previous checkpoint"></button>
      <button id="step-back" class="icon-button" title="Step backward" aria-label="Step backward"></button>
      <button id="play-pause" class="primary">Play</button>
      <button id="step-forward" class="icon-button" title="Step forward" aria-label="Step forward"></button>
      <button id="checkpoint-forward" class="icon-button" title="Next checkpoint" aria-label="Next checkpoint"></button>
      <button id="reset-sim" class="icon-button" title="Reset to time 0" aria-label="Reset"></button>
    </div>
    <div class="timeline-track">
      <input id="time-slider" type="range" min="0" max="0" value="0" list="checkpoint-marks" aria-label="Simulation timeline">
      <div id="checkpoint-ticks" aria-hidden="true"></div>
      <datalist id="checkpoint-marks"></datalist>
    </div>
    <div class="timeline-readouts" aria-live="polite">
      <span id="time-label">Time: 0</span>
      <span id="stats-label"></span>
    </div>
  </div>

  <div id="viewbar" class="toolbar">
    <div class="panel-toggles">
      <button id="toggle-explorer" aria-pressed="true" aria-expanded="true" aria-controls="component-explorer" title="Component explorer">Explorer</button>
      <button id="toggle-inspector" aria-pressed="false" aria-expanded="false" aria-controls="inspector" title="Selection inspector">Info</button>
    </div>
    <div class="view-actions">
      <button id="reset-view">Reset View</button>
      <button id="zoom-out" class="icon-button" title="Zoom out" aria-label="Zoom out"></button>
      <button id="zoom-in" class="icon-button" title="Zoom in" aria-label="Zoom in"></button>
      <span class="toolbar-divider" aria-hidden="true"></span>
      <button id="undo-layout" class="icon-button" title="Undo layout change" aria-label="Undo layout change" disabled></button>
      <button id="redo-layout" class="icon-button" title="Redo layout change" aria-label="Redo layout change" disabled></button>
      <button id="reset-layout" title="Reset layout">Reset Layout</button>
      <button id="save-layout" title="Save layout">Save Layout</button>
      <span id="save-status"></span>
    </div>
  </div>

  <aside id="component-explorer" aria-label="Component fidelity explorer">
    <div class="explorer-header">
      <div>
        <div class="explorer-title">Components</div>
        <div class="explorer-subtitle">
          Expand structural blocks. Collapse behavioral blocks.
        </div>
      </div>
      <button id="explorer-close" class="panel-close" title="Close explorer" aria-label="Close explorer">&times;</button>
    </div>
    <div class="explorer-search-wrap">
      <input
        id="explorer-search"
        type="search"
        placeholder="Find component"
        autocomplete="off"
        spellcheck="false"
        aria-label="Find component">
    </div>
    <div id="explorer-viewport" role="tree" aria-label="Circuit components">
      <div id="explorer-spacer"></div>
      <div id="explorer-rows"></div>
    </div>
    <div class="explorer-footer">
      <div id="explorer-status" aria-live="polite"></div>
      <div class="explorer-actions">
        <button id="revert-profile" disabled>Revert</button>
        <button id="apply-profile" class="primary" disabled>Apply &amp; Run</button>
      </div>
    </div>
    <div id="explorer-resizer" aria-hidden="true"></div>
  </aside>

  <div id="tooltip" role="tooltip"></div>
  <aside id="inspector" class="inspector hidden" aria-label="Selection inspector">
    <div class="inspector-header">
      <div class="inspector-heading">
        <div class="inspector-eyebrow">Inspector</div>
        <div id="inspector-title" class="inspector-title"></div>
        <div id="inspector-subtitle" class="inspector-subtitle"></div>
        <div id="inspector-path" class="inspector-path"></div>
      </div>
      <button id="inspector-close" class="inspector-close" title="Close inspector" aria-label="Close inspector">&times;</button>
    </div>
    <div class="inspector-body">
      <div id="selection-info-section" class="inspector-section hidden">
        <div class="inspector-section-title">Details</div>
        <div id="selection-info" class="inspector-table"></div>
      </div>
      <div id="memory-inspector-section" class="inspector-section hidden">
        <div class="inspector-section-title">Memory</div>
        <div id="memory-details" class="inspector-table"></div>
        <form id="memory-address-form" class="memory-address-form">
          <label for="memory-address">Byte address</label>
          <input id="memory-address" type="text" placeholder="0x00000100" autocomplete="off" spellcheck="false">
          <button type="submit">Go</button>
        </form>
        <div class="memory-page-actions">
          <button id="memory-page-prev" title="Previous address page">Previous page</button>
          <button id="memory-page-next" title="Next address page">Next page</button>
          <button id="memory-follow" aria-pressed="true">Follow access</button>
        </div>
        <div id="memory-page-summary" class="inspector-value"></div>
      </div>
      <div id="component-pins-section" class="inspector-section hidden">
        <div class="inspector-section-title">Pins</div>
        <div id="component-pins" class="pin-list"></div>
      </div>
      <div id="type-style-section" class="inspector-section">
        <div class="inspector-section-title">Type style</div>
        <label class="inspector-field">
          <span>Aspect ratio</span>
          <input id="component-aspect" type="range" min="0.1" max="3" step="0.05">
        </label>
        <div id="component-aspect-value" class="inspector-value"></div>
        <div class="inspector-field">
          <span>Color</span>
          <div class="color-control">
            <input id="component-color" type="color" aria-label="Component color picker">
            <input id="component-color-code" class="color-code-input" type="text" maxlength="7" placeholder="#43afff" spellcheck="false" aria-label="Component color hex code">
          </div>
        </div>
        <button id="restore-type-style">Restore Type Style</button>
      </div>
      <div id="layout-section" class="inspector-section">
        <div class="inspector-section-title">Default layout</div>
        <div class="inspector-actions">
          <button id="restore-placement">Restore Placement</button>
          <button id="restore-children-layout">Restore Children</button>
        </div>
      </div>
    </div>
  </aside>
  <div id="loading">Loading circuit...</div>
  <script src="runtime-config.js?v=1"></script>
  <script src="transport.js?v=14"></script>
  <script src="explorer.js?v=3"></script>
  <script src="wire_geometry.js?v=1"></script>
  <script src="rewire_geometry.js?v=4"></script>
  <script src="memory_cell_view.js?v=1"></script>
  <script src="memory_view.js?v=1"></script>
  <script src="app.js?v=71"></script>
</body>
</html>
